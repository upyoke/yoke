# Yoke self-host bundle: the API server plus its Postgres database.
# Materialized by `yoke self-host init`. Runtime knobs live in .env;
# generated credentials ride owner-only files under secrets/ — never
# .env values, because compose interpolates $ inside them.
services:
  db:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_DB: yoke
      POSTGRES_USER: yoke
      POSTGRES_PASSWORD_FILE: /run/yoke-db-bootstrap/password
    # PostgreSQL has no Python runtime. Its existing entrypoint waits for the
    # host operator to stream the password into this private tmpfs over exec.
    entrypoint:
      - sh
      - -c
      - >-
        attempts=0;
        until test -s "$$POSTGRES_PASSWORD_FILE"; do
          attempts=$$((attempts + 1));
          if test "$$attempts" -ge __HANDOFF_TIMEOUT_SECONDS__; then
            echo 'self_host_database_handoff_timeout: restart with yoke self-host init --protect-existing --start' >&2;
            exit 1;
          fi;
          sleep 1;
        done;
        exec docker-entrypoint.sh postgres
    tmpfs:
      - /run/yoke-db-bootstrap:mode=0700
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoke -d yoke"]
      interval: 5s
      timeout: 3s
      retries: 24

  core:
    image: ${YOKE_SERVER_IMAGE}
    # The public image remains USER yoke. This self-host-only bootstrap starts
    # as root to accept the private exec handoff, then drops every group/uid
    # privilege before writing runtime-owned tmpfs inputs and execing the server.
    user: "0:0"
    entrypoint: ["python", "-m", "yoke_core.tools.self_host_server_bootstrap"]
    command: []
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - yoke_core.tools.self_host_server_bootstrap
        - --healthcheck
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      YOKE_SERVER_MODE: self-host
      YOKE_PG_DSN_FILE: /dev/shm/yoke-runtime-secrets/yoke-db-dsn
      YOKE_SELF_HOST_HANDOFF: required
      YOKE_FIRST_BOOT_TOKEN_HOST_PATH: ./secrets/first-boot-admin-token
      # The installer's name: first boot creates the first admin as this
      # person and refuses to birth a universe without it.
      YOKE_ADMIN_NAME: ${YOKE_ADMIN_NAME:-}
      # The publish spec, so the boot banner prints a real connect URL
      # instead of a placeholder the operator has to translate.
      YOKE_API_PUBLISH: ${YOKE_API_PUBLISH:-127.0.0.1:8765}
      # Only these transport peers may supply scheme/client forwarding headers.
      YOKE_API_TRUSTED_PROXIES: ${YOKE_API_TRUSTED_PROXIES-127.0.0.1}
      # Browser sign-in door (optional). Set the values in .env to
      # enable; blank keeps the door disabled. The client secret rides
      # a host-opened secret file — see the commented blocks below.
      YOKE_OIDC_ISSUER: ${YOKE_OIDC_ISSUER:-}
      YOKE_OIDC_CLIENT_ID: ${YOKE_OIDC_CLIENT_ID:-}
      YOKE_OIDC_REDIRECT_URL: ${YOKE_OIDC_REDIRECT_URL:-}
      YOKE_OIDC_CLIENT_SECRET_FILE: ${YOKE_OIDC_CLIENT_SECRET_FILE:-}
      # GitHub App installation-token authority (optional). Nonsecret values
      # live in .env; the private key is a host-opened owner-only file.
      YOKE_GITHUB_APP_ISSUER: ${YOKE_GITHUB_APP_ISSUER:-}
      YOKE_GITHUB_APP_API_URL: ${YOKE_GITHUB_APP_API_URL:-}
      YOKE_GITHUB_APP_WEB_URL: ${YOKE_GITHUB_APP_WEB_URL:-}
      YOKE_GITHUB_APP_ID: ${YOKE_GITHUB_APP_ID:-}
      YOKE_GITHUB_APP_CLIENT_ID: ${YOKE_GITHUB_APP_CLIENT_ID:-}
      YOKE_GITHUB_APP_SLUG: ${YOKE_GITHUB_APP_SLUG:-}
      YOKE_GITHUB_APP_PRIVATE_KEY_FILE: ${YOKE_GITHUB_APP_PRIVATE_KEY_FILE:-}
    ports:
      - "${YOKE_API_PUBLISH:-127.0.0.1:8765}:8765"

volumes:
  pgdata:
