[build-system]
# Exact backends keep PEP 517 builds reproducible.
requires = [
    "setuptools==83.0.0",
    "setuptools-scm[toml]==10.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yoke-cli"
dynamic = ["version"]
description = "Yoke CLI — the installable `yoke` command (local client + project-file writer)"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "yoke-contracts",
    # Full-screen `yoke setup` wizard. Imported lazily so non-interactive
    # and import-graph paths never require it; resolved from PyPI by uv.
    "textual>=0.60",
    # Checkout Docker builds resolve the same SCM version as the wheel backend.
    "setuptools-scm>=10.2,<11",
]

[project.scripts]
yoke = "yoke_cli.main:main"

[project.optional-dependencies]
# Retained so `yoke-cli[images]` keeps resolving for anything that names it;
# Pillow arrives as a required yoke-contracts dependency.
images = ["Pillow>=10.0,<12"]

[project.entry-points."yoke.runtime"]
command_targets = "yoke_cli.commands._helpers"
help_invocation = "yoke_cli.commands.help_invocation"
browser_node_toolchain = "yoke_cli.browser_node_toolchain"
deployment_execution_authority = "yoke_cli.commands.adapters.deployment_execution_authority"
project_snapshot = "yoke_cli.commands.adapters.project_snapshot"
merge_item_local_runtime = "yoke_cli.commands.merge_item_local_runtime"
pulumi_stack_config_loader = "yoke_cli.commands.pulumi_stack_config_loader"
browser_profile = "yoke_cli.config.browser_profile"
credentialed_git = "yoke_cli.config.credentialed_git"
github_project_setup = "yoke_cli.config.github_project_setup"
github_publish = "yoke_cli.config.github_publish"
hosted_machine_browser = "yoke_cli.config.hosted_machine_browser"
install_advice = "yoke_cli.config.install_advice"
onboard_project_github_inputs = "yoke_cli.config.onboard_project_github_inputs"
operator_cli_release_follow = "yoke_cli.config.operator_cli_release_follow"
project_git_bootstrap = "yoke_cli.config.project_git_bootstrap"
project_git_prerequisite = "yoke_cli.config.project_git_prerequisite"
project_github_adoption = "yoke_cli.config.project_github_adoption"
project_onboard_support = "yoke_cli.config.project_onboard_support"
project_slug_lookup = "yoke_cli.config.project_slug_lookup"
repo_upstream_freshness = "yoke_cli.config.repo_upstream_freshness"
repo_upstream_git = "yoke_cli.config.repo_upstream_git"
setup_facts_summary = "yoke_cli.config.setup_facts_summary"
machine_config_writes = "yoke_cli.config.writer"
manifest = "yoke_cli.manifest"
operating_layer_drift = "yoke_cli.operating_layer_drift"
packs = "yoke_cli.packs"
receipt = "yoke_cli.packs.receipt"
cursor_permissions = "yoke_cli.project_install.cursor_permissions"
project_install_files = "yoke_cli.project_install.files"
project_install_git_hooks = "yoke_cli.project_install.git_hooks"
project_installation = "yoke_cli.project_install.runner"
control_plane_payload = "yoke_cli.transport.control_plane_payload"
dispatcher = "yoke_cli.transport.dispatcher"
https = "yoke_cli.transport.https"
relay_telemetry = "yoke_cli.transport.relay_telemetry"
serving_plane = "yoke_cli.transport.serving_plane"
session_liveness = "yoke_cli.transport.session_liveness"

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The onboarding wizard's stylesheet ships beside its app module; Textual
# resolves CSS_PATH relative to the module file.
"yoke_cli.config" = ["onboard_wizard.tcss"]
# The self-host compose bundle ships inside the wheel; `yoke self-host
# init` materializes it via importlib.resources.
"yoke_cli.self_host" = ["docker-compose.yml"]

# One-line command summaries ship as data beside the command catalog.
"yoke_cli.commands" = ["summaries/*.json"]

# Immutable ownership evidence lets packaged clients retire known released copies.
"yoke_cli.project_install" = ["released_bundle_hashes.json"]
