[build-system]
# Exact backends keep PEP 517 builds reproducible.
requires = [
    "setuptools==83.0.0",
    "setuptools-scm[toml]==10.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yoke-harness"
dynamic = ["version"]
description = "Yoke harness — client-side agent-runtime adapters + fast local guardrails"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "yoke-contracts",
    # Shared client substrate (transport/config) lives in yoke-cli per Decision 1.
    "yoke-cli",
    "httpx==0.28.1",
    "browser-cookie3>=0.20.1,<1",
]

[project.entry-points."yoke.runtime"]
hook_session_lifecycle = "yoke_harness.hooks.session_lifecycle"
hook_client_facts = "yoke_harness.hooks.client_facts"
hook_decision_render = "yoke_harness.hooks.decision_render"
identity_observed = "yoke_harness.hooks.identity_observed"
cursor_session_map = "yoke_harness.hooks.cursor_session_map"
identity_codex_runtime = "yoke_harness.hooks.identity_codex_runtime"
model_attestation = "yoke_harness.model_attestation"
browser_automatic_sign_in = "yoke_harness.browser_automatic_sign_in"
browser_check_profile = "yoke_harness.browser_check_profile"
browser_client_readiness = "yoke_harness.browser_client_readiness"
browser_human_gate = "yoke_harness.browser_human_gate"
browser_runtime_home = "yoke_harness.browser_runtime_home"
browser_setup = "yoke_harness.browser_setup"
file_line_check = "yoke_harness.git_hooks.file_line_check"
golden_harness_clis = "yoke_harness.golden_harness_clis"
golden_snapshot_retention = "yoke_harness.golden_snapshot_retention"
harness_cli_latest = "yoke_harness.harness_cli_latest"
harness_setup_reconcile = "yoke_harness.harness_setup_reconcile"
identity = "yoke_harness.hooks.identity"
identity_relay = "yoke_harness.hooks.identity_relay"
linux_desktop_state = "yoke_harness.linux_desktop_state"
qa_host_package_fixture = "yoke_harness.qa_host_package_fixture"
remote_file_copy = "yoke_harness.remote_file_copy"
session_relay_harness_reconcile = "yoke_harness.session_relay_harness_reconcile"
ssh_linux_browser_approval = "yoke_harness.ssh_linux_browser_approval"
ssh_linux_host_operations = "yoke_harness.ssh_linux_host_operations"
ssh_linux_terminal = "yoke_harness.ssh_linux_terminal"
ssh_mac_baseline_probes = "yoke_harness.ssh_mac_baseline_probes"
ssh_mac_browser_approval = "yoke_harness.ssh_mac_browser_approval"
ssh_mac_gui_session = "yoke_harness.ssh_mac_gui_session"
ssh_mac_host_session_state = "yoke_harness.ssh_mac_host_session_state"
ssh_mac_terminal_automation_probe = "yoke_harness.ssh_mac_terminal_automation_probe"
ssh_mac_terminal_capture = "yoke_harness.ssh_mac_terminal_capture"
ssh_mac_transport = "yoke_harness.ssh_mac_transport"
ssh_windows_host_operations = "yoke_harness.ssh_windows_host_operations"
terminal_control = "yoke_harness.terminal_control"
test_machine_operations = "yoke_harness.test_machine_operations"
test_machine_remote_exec = "yoke_harness.test_machine_remote_exec"
test_machine_temp_state = "yoke_harness.test_machine_temp_state"
usage_attestation = "yoke_harness.usage_attestation"

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yoke_harness.browser_runtime" = [
    "package.json",
    "package-lock.json",
    "README.md",
    "src/*.js",
    "src/*.json",
    "src/*.mjs",
    "src/**/*.js",
    "tests/*.js",
    "tests/**/*.js",
    "tests/fixtures/*.html",
]
