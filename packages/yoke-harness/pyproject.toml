[build-system]
# Exact backends keep PEP 517 builds reproducible.
requires = [
    "setuptools==83.0.0",
    "setuptools-scm[toml]==10.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yoke-harness"
dynamic = ["version"]
description = "Yoke harness — client-side agent-runtime adapters + fast local guardrails"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "yoke-contracts",
    # Shared client substrate (transport/config) lives in yoke-cli per Decision 1.
    "yoke-cli",
    "httpx==0.28.1",
]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yoke_harness.browser_runtime" = [
    "package.json",
    "package-lock.json",
    "README.md",
    "src/*.js",
    "src/**/*.js",
    "tests/*.js",
    "tests/**/*.js",
    "tests/fixtures/*.html",
]
