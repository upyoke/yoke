[build-system]
# Exact backends keep PEP 517 builds reproducible. Setuptools 83 is current;
# 82.0.1 is the final exact line compatible with supported Python 3.9.
requires = [
    "setuptools==82.0.1; python_version < '3.10'",
    "setuptools==83.0.0; python_version >= '3.10'",
    "setuptools-scm[toml]==10.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yoke-contracts"
dynamic = ["version"]
description = "Yoke shared wire/file contracts — zero-authority types and pure helpers"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.13.4",
    # board-art ASCII variant generation (FIGlet banners) — pure, client-safe.
    "pyfiglet>=1.0.4,<2",
    # Reading Codex's own config.toml for its approval, sandbox, and folder
    # trust keys. Stdlib tomllib from 3.11; a 3.10 wheel needs the backport,
    # and without it every command crashes at import rather than at use.
    "tomli>=2.0,<3; python_version < '3.11'",
    # Renders a recorded QA screenshot into the region and size a reviewer
    # can read (`yoke qa artifact read --region/--scale`). A required
    # dependency, not an extra: evidence a reviewer cannot open is evidence
    # that proves nothing, and the only alternative renderer on this path
    # (macOS `sips --cropOffset`) exits zero without cropping for some
    # offsets, which would label the whole capture as the chosen region.
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
# Retained so `yoke-contracts[images]` keeps resolving for anything that
# names it; Pillow is now a required dependency above.
images = ["Pillow>=10.0,<12"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Board-art emoji-grid data ships as package data so the loader stays under the
# authored cap.
"yoke_contracts.project_contract.board_art.data" = ["*.txt"]
