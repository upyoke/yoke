<body class="local-universe-page">
  <div id="universe-root"></div>
  <script type="module">
    // Bootstrap: hand the mount root to the app module and get out of the
    // way. The session cookie set by this page's response authenticates the
    // module fetch and every API call, so nothing token-shaped lives here.
    // A local universe trivially has its machine connected, so this page —
    // not the engine — supplies the onboarding machine fact.
    import { mountUniverseApp } from "./assets/app.js";
    // The UI server replaces the host-identity marker with the live packet
    // at serve time. The placeholder object is only for static file opens.
    const hostIdentity = /*YOKE_HOST_IDENTITY*/{
      "versionLabel": "source",
      "environmentLabel": "local universe",
      "runtimeIdentity": {
        "version": "source",
        "installKind": "source_checkout",
        "environmentLabel": "local universe",
        "portabilityMode": "local"
      }
    }/*YOKE_HOST_IDENTITY*/;
    mountUniverseApp(document.getElementById("universe-root"), {
      // The loopback door authenticates a machine session rather than an
      // account. Until the server projects the resolved actor, name that
      // fact honestly instead of presenting the organization as the viewer.
      currentActor: { kind: "human", label: "local actor" },
      ...hostIdentity,
      docsUrl: "https://github.com/upyoke/yoke/tree/main/docs",
      capabilities: {
        data: {
          portability: { mode: "local", sectionOwned: false },
          onboarding: { machineConnected: true },
        },
      },
    });
  </script>
