<body class="local-universe-page">
  <div id="universe-root"></div>
  <script type="module">
    // Bootstrap: hand the mount root to the app module and get out of the
    // way. The session cookie the serving host set authenticates the module
    // fetch and every API call, so nothing token-shaped lives here.
    import { createHttpFunctionClient, mountUniverseApp } from "/assets/app.js";
    // The serving host — the Local view or a self-hosted Yoke server —
    // replaces the host-identity marker with its live packet at serve time:
    // identity, actor, capabilities, and the function-call endpoint when it
    // is not the default. The placeholder object is only for static file
    // opens.
    const hostIdentity = /*YOKE_HOST_IDENTITY*/{
      "versionLabel": "source",
      "environmentLabel": "local universe",
      "runtimeIdentity": {
        "version": "source",
        "installKind": "source_checkout",
        "environmentLabel": "local universe",
        "portabilityMode": "local"
      },
      "capabilities": {
        "data": {
          "portability": { "mode": "local", "sectionOwned": false },
          "onboarding": { "machineConnected": true }
        }
      }
    }/*YOKE_HOST_IDENTITY*/;
    const { functionCallEndpoint, ...mountOptions } = hostIdentity;
    mountUniverseApp(document.getElementById("universe-root"), {
      // A resolved actor in the host packet replaces this label; an
      // unidentified Local viewer keeps preferences only for this mount.
      currentActor: { kind: "human", label: "local actor" },
      ...mountOptions,
      client: createHttpFunctionClient({ endpoint: functionCallEndpoint }),
      docsUrl: "https://github.com/upyoke/yoke/tree/main/docs",
    });
  </script>
</body>
