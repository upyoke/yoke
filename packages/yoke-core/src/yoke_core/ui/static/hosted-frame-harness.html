<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoke — hosted-frame harness</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./shell.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./activation.css">
  <link rel="stylesheet" href="./workflows.css">
  <link rel="stylesheet" href="./workflow_posture.css">
  <link rel="stylesheet" href="./workflow_controls.css">
  <link rel="stylesheet" href="./workflow_canon_status.css">
  <link rel="stylesheet" href="./workflow_mechanics.css">
  <link rel="stylesheet" href="./test_machine.css">
  <link rel="stylesheet" href="./qa.css">
  <link rel="stylesheet" href="./inbox.css">
  <link rel="stylesheet" href="./items.css">
  <link rel="stylesheet" href="./strategy.css">
  <link rel="stylesheet" href="./execution_instructions.css">
  <style>
    /* Harness chrome only — never the product. The bar exists so nobody can
       mistake this page for the app: everything below it is the real frame
       with sample platform chrome occupying the mount slots. */
    :root {
      /* One value decides how tall the bar stands and how much room it costs
         the frame beneath it. */
      --harness-bar-height: 34px;
    }
    .harness-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      /* Border-box so the rule beneath the bar is part of its one height and
         the frame's inset stays exact. */
      box-sizing: border-box;
      height: var(--harness-bar-height);
      background: #111318;
      color: #e7e9ee;
      border-bottom: 1px solid #2a2e37;
      font-family: var(--yoke-font-sans);
      font-size: 12px;
    }
    .harness-meta .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--yoke-warn);
    }
    .harness-meta b { font-weight: 600; }
    .harness-meta span { opacity: .75; }
    /* The host container, shaped the way a host's really is: a plain wrapper
       that declares no definite height of its own. The platform's does the
       same, so a frame that goes back to sizing itself from an ancestor
       collapses here — on a laptop — instead of in the hosted product. The
       inset for the bar above rides on this container as a host declares it,
       not on an ancestor's height. */
    .harness-host-container {
      --yoke-app-frame-height: calc(100dvh - var(--harness-bar-height));
    }
    /* The harness's own stand-in for a host's contentBefore block. Quiet
       panel dress so a frame check reads layout, not a styling defect. */
    .harness-content-notice {
      margin: 16px 30px 0;
      padding: 10px 14px;
      border: 1px solid var(--yoke-border);
      border-radius: var(--yoke-radius);
      background: var(--yoke-surface);
      color: var(--yoke-muted);
      font-size: 12.5px;
    }
  </style>
</head>
<body class="local-universe-page">
  <div class="harness-meta">
    <span class="dot"></span>
    <b>Hosted-frame harness</b>
    <span id="harness-source">sample platform chrome in every mount slot · real local reads · not the product</span>
  </div>
  <div class="harness-host-container">
    <div id="universe-root"></div>
  </div>
  <script type="module">
    // The hosted frame, verifiable without a pin: this page mounts the same
    // app as index.html but fills the mount slots with nodes shaped exactly
    // like the platform's hosted chrome (same class names, same structure —
    // see the platform's createHostedSlots). A frame defect that only shows
    // with occupied slots shows here, on a laptop, before anything ships.
    import { mountUniverseApp } from "./app.js";
    import {
      hostedFrameWorkflowClient,
    } from "./hosted_frame_workflows_fixture.js";

    const SAMPLE_ORG = { slug: "acme", name: "Acme (sample)" };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // topbarStart — the platform's org switcher.
    function sampleOrgSwitcher() {
      const label = el("label", "hosted-org-switcher");
      label.appendChild(el("span", null, "Organization"));
      const select = document.createElement("select");
      select.setAttribute("aria-label", "Organization");
      for (const name of ["Acme (sample)", "Second Org (sample)"]) {
        const option = el("option", null, name);
        select.appendChild(option);
      }
      label.appendChild(select);
      return label;
    }

    // topbarEnd — the platform's user menu: an avatar-mark chip whose full
    // name rides the accessible label and the opened panel.
    function sampleUserMenu() {
      const details = el("details", "hosted-user-menu");
      const summary = el("summary");
      summary.setAttribute("aria-label", "Ben (sample)");
      summary.appendChild(el("span", "hosted-user-avatar", "B"));
      details.appendChild(summary);
      const panel = el("div", "hosted-user-menu-panel");
      panel.appendChild(el("p", null, "Ben (sample) · ben@example.com"));
      const dashboard = el("a", null, "All organizations");
      dashboard.href = "/dashboard";
      panel.appendChild(dashboard);
      const form = document.createElement("form");
      form.addEventListener("submit", (event) => event.preventDefault());
      const signOut = el("button", null, "Sign out");
      signOut.type = "submit";
      form.appendChild(signOut);
      panel.appendChild(form);
      details.appendChild(panel);
      return details;
    }

    // contentBefore — the platform ships a hidden reserved node here today;
    // the harness keeps a visible sample block instead so the stacked
    // content column is exercised, not just tolerated.
    function sampleContentNotice() {
      const notice = el(
        "p", "harness-content-notice",
        "Sample notice occupying the contentBefore slot.",
      );
      notice.setAttribute("role", "status");
      return notice;
    }

    // contentAfter — the platform ships a hidden reserved node here
    // (data-platform-slot="github-connection"); mirror that shape so the
    // harness verifies the frame the platform actually injects.
    function sampleReservedContentAfter() {
      const container = el("div", null);
      container.hidden = true;
      container.setAttribute("aria-hidden", "true");
      container.dataset.platformSlot = "github-connection";
      return container;
    }

    // sections — the platform's host-fed destination content. Supplying
    // these lights the corresponding entries in the workbench's flat nav
    // arc; hosted controls live inside their destination rather than in a
    // second injected link group.
    function sampleHostSection(title, text) {
      const panel = el("section", "panel");
      const header = el("div", "panel-header");
      header.appendChild(el("h2", null, title));
      panel.appendChild(header);
      const body = el("div", "panel-body");
      body.appendChild(el("p", null, text));
      panel.appendChild(body);
      return panel;
    }

    const useWorkflowFixture = new URLSearchParams(location.search)
      .has("workflow-fixture");
    if (useWorkflowFixture) {
      document.getElementById("harness-source").textContent =
        "sample platform chrome · deterministic workflow data · not the product";
    }

    mountUniverseApp(document.getElementById("universe-root"), {
      client: useWorkflowFixture ? hostedFrameWorkflowClient() : undefined,
      environmentLabel: "hosted universe · Acme (sample)",
      versionLabel: "frame harness",
      runtimeIdentity: {
        version: "frame harness",
        installKind: "hosted_pin",
        environmentLabel: "hosted universe · Acme (sample)",
        portabilityMode: "hosted",
      },
      docsUrl: "https://github.com/upyoke/yoke/tree/main/docs",
      capabilities: {
        flags: ["hosted-shell"],
        data: {
          portability: { mode: "hosted" },
          memberDirectory: { "2": "ben", "5": "dana" },
        },
        actions: [{
          label: "Move universe",
          options: [
            { id: "download", label: "Download universe" },
            { id: "import", label: "Import universe" },
          ],
          onInvoke(option) {
            globalThis.console.log("harness capability action", option);
          },
        }],
      },
      slots: {
        topbarStart: sampleOrgSwitcher(),
        topbarEnd: sampleUserMenu(),
        contentBefore: sampleContentNotice(),
        contentAfter: sampleReservedContentAfter(),
      },
      sections: {
        projects: sampleHostSection(
          "Create project",
          "Sample hosted project setup supplied by the platform. In the " +
            "product this section owns repository selection and provisioning.",
        ),
        members: sampleHostSection(
          "Members",
          "Sample member roster supplied by the host platform.",
        ),
        billing: sampleHostSection(
          "Billing",
          "Sample billing summary supplied by the host platform.",
        ),
        // The hosted GitHub connection is the organization's, not any one
        // project's, so the platform declares it unscoped and the frame must
        // stand it above the view's picker. Framed here at the same
        // placement, or the harness would verify a frame nobody ships.
        github: {
          placement: "beforeScope",
          content: sampleHostSection(
            "Authorized account",
            "Sample organization-wide GitHub connection supplied by the host " +
              "platform. It sits above the project picker because no project " +
              "narrows it.",
          ),
        },
      },
    });
  </script>
</body>
</html>
