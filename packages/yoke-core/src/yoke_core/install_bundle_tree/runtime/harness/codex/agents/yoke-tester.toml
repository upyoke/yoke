### DB Quick Reference — qa (requirements, runs, gate preview)

**Wrapper commands (prefer over raw SQL):**

- _List QA requirements for an item or epic_
  - `yoke qa requirement list --item PREFIX-N`
  - Registered read qa.requirement.list (works over https). Use --epic-id E for epic-task requirements; filter by task_num client-side. Unfiltered / epic-id reads take `--project` (or $YOKE_PROJECT / checkout map) from any mapped checkout. One row by id: `yoke qa requirement get --requirement-id <id>`. qa_requirements.id is the PK. Do not teach requirement_id as a short-form column.
- _List QA runs for a requirement_
  - `yoke qa run list --requirement-id <id>`
  - Registered read qa.run.list (works over https). Verify recorded runs before claiming a verdict. Unfiltered list takes `--project` (or $YOKE_PROJECT / checkout map). Rows carry verdict (pass/fail/undetermined/error), verdict_reason (required for undetermined; agent outcomes also need linked evidence), execution_status (capture outcome), and raw_result (result payload). qa_runs.qa_requirement_id is the FK. Do not teach result as a short-form column.
- _Get one QA run by id_
  - `yoke qa run get --run-id <id> [--project <slug>]`
  - Registered read qa.run.get (works over https). Project-scoped: pass --project, else $YOKE_PROJECT / checkout map. Returns one qa_runs row including verdict, verdict_reason, execution_status, raw_result, duration_ms, started_at, and completed_at. Wrong-project runs return project_mismatch.
- _Add a QA requirement — ac_verification variant_
  - `yoke qa requirement add --item PREFIX-N --qa-kind ac_verification --qa-phase verification --blocking-mode blocking --requirement-source ac_derived --workflow-transition reviewed-implementation`
  - Registered write qa.requirement.add — item-claim-gated, item-attached. `--workflow-transition` is required and must name a stage in the item's pinned workflow that carries or precedes a qa_verification gate. ac_verification omits `--success-policy` by default; stricter policy is `{"min_runs":N,"min_pass":N}`. Several rows in one transaction: pipe a JSON array to `yoke qa requirement add-batch --item PREFIX-N --stdin`; every row must include `workflow_transition_id`. Epic-task attachment is operator-debug only and requires the same binding: `python3 -m yoke_core.domain.qa requirement-add --epic-id E --task-num K --workflow-transition STAGE ...`. Deployment-run attachment is operator-debug only and may omit the transition because the run owns its delivery context.
- _Materialize attached QA plan cases for a transition_
  - `yoke qa plan materialize --item PREFIX-N --transition reviewed-implementation`
  - Registered write qa.plan.materialize. Materialization is idempotent and snapshots each attached plan case into one qa_requirements row carrying method_id, instructions, expected_outcome, immutable method_config, and the plan's environment/tenant/project execution target. Read the result with `yoke qa requirement list --item PREFIX-N`; standard materialization never rewrites an existing case snapshot. For a corrected definition, run `yoke qa plan rematerialize --item PREFIX-N --transition reviewed-implementation`; it refreshes matching requirements without losing runs, adds new cases, and waives removed cases. On a workflow whose QA policy is optional item attachment (Dash), both attach and materialize accept only the plan or method named in items.workflow_posture.verification; an item filed without one selects it after the fact with `yoke workflows item-posture amend PREFIX-N --verification-plan ID_OR_SLUG --reason TEXT` (--help for the per-key decision tree). Wrong guesses: that `yoke qa item-plan attach` can select verification on an unselected Dash, and that the create-time selection is final so the item must be re-filed.
- _Edit a project QA plan as one compare-and-swap document_
  - `yoke qa plan edit release-readiness`
  - Registered write qa.plan.edit. From a mapped project checkout, the command resolves project context, opens a clean JSON plan document in $VISUAL / $EDITOR, and saves metadata plus the full ordered case set and `target_environment` name in one transaction. The environment must belong to the plan project and match the hosted runtime. A stale updated_at refuses the write and preserves the edited file. v1 accepts only the all-pass policy; materialized item requirements stay unchanged until an explicit re-materialization.
- _Add a QA run verdict — agent × ac_verification (inline raw_result)_
  - `yoke qa run add --requirement-id R --performed-by agent --qa-kind ac_verification --verdict pass --head-sha <commit> --raw-result 'Full backend pytest passed: N passed, K skipped.'`
  - Registered write qa.run.add — item claims remain required for item-backed requirements; deployment-run requirements use their server-resolved run subject. A blocking pass stamps verification_tree.head_sha from the claimed lane HEAD on a clean tree, or from --head-sha. `--raw-result` is evidence text, not the run identity; a blocking pass without a head sha is refused. `--qa-kind` defaults to the requirement's kind (mismatch is a hard error). For multi-line evidence, read the file and pass the literal content through `--raw-result`.
- _Execute an item's materialized QA plans in snapshot order_
  - `yoke qa plan run --item PREFIX-N --transition TRANSITION --base-url https://preview.example`
  - Begins or resumes a server-authorized execution before any local runner runs. Stage pins the immutable roster, digest, durable cursor, actor/session owner, and any machine lease; each canonical result advances that cursor. After capture, agent-verdict cases produce one immutable review bundle and state=awaiting_agent_review; exit 12 requires the harness to dispatch the returned typed reviewer contract and submit its complete verdict batch. An agent_mission bundle stays owned by the main agent, which dispatches atomic walkers, handles human gates between walker turns, and chooses the final verdict. Only agent undetermined requires attached evidence, halts the item, and creates owner/operator Inbox work. A case that never ran uses the failed/blocked outcome instead. Waiting runs resume from the same cursor, while completion or abort releases the lease. Hosted services never resolve local runner credentials.
- _Execute a named project plan on its real deployment-run subject (never a synthetic item or host_control bypass)_
  - `yoke qa plan run --deployment-run-id RUN --plan installer-campaign --project yoke`
- _Execute one materialized Browser method case_
  - `yoke qa case run --requirement-id R --base-url https://preview.example --expected-branch BRANCH --expected-sha SHA`
  - The shared case runner authorizes and fetches the immutable snapshot through qa.case_execution.begin before local work, executes only requirement R, and owns qa.run.add / qa.run.complete / qa.artifact.add evidence writes. An active item claim and ambient session are required. browser-check decides automatically; browser-inspection attaches evidence before an undetermined verdict, which halts the item and creates an owner/operator review request. A case that did not run records blocked_on_precondition instead. Item-backed cases require the active item claim; deployment-run cases require project permission and the bound execution session. Never add a parallel Browser run manually.
- _Preview the reviewed-implementation gate verdict_
  - `yoke qa gate-summary --item PREFIX-N --target reviewed-implementation`
  - Registered read qa.gate_summary.run. Use --item for a standalone issue, or --epic-id E --task-num K for an epic task. The summary is diagnostic only — even with passing tests, route via `/yoke advance PREFIX-N reviewed-implementation` (never raw items update) so the gate runs and claim handoff fires.
- _Summarize unsatisfied QA requirements (read-only)_
  - `yoke qa gate-summary --item PREFIX-N --target {reviewed-implementation,implemented}`
  - Registered read qa.gate_summary.run (works over https — replaces the checkout-shaped db_router gate-summary agent leg). Diagnostic only — never mutates qa_runs/qa_requirements. Run before /yoke advance reviewed-implementation or /yoke polish to see which blocking requirements still need passing runs. Use --epic-id E --task-num K for epic tasks; the bare call prints the summary JSON.
- _Inspect events for an item (canonical agent shape)_
  - `yoke events query --item PREFIX-N --limit 20`
  - Add `--event-name X`, `--since ISO|'2 hours ago'`, `--until ...` for narrowing; `--session S --current-episode` bounds to the current session episode (fails closed without `--session`). Siblings: `yoke events tail --limit 20` (zero-config recent slice), `yoke events count`, `yoke events anomalies`.
- _Epic dispatch chain (list / advance / inspect)_
  - `yoke epic-tasks list --epic 1704
yoke workflow-item epic-task body-get --epic 1704 --task-num 5
yoke workflow-item epic-dispatch-chain list --epic 1704
yoke workflow-item epic-dispatch-chain get --epic 1704 --worktree branch-name`
  - Task list + body reads are wrapped (epic_tasks.list.run / workflow_item.epic_task.body_get). Dispatch-chain reads use workflow_item.epic_dispatch_chain.list/get. Epic id is bare integer. Task num is 1-based.

**Schema cheat sheet:**

- **`qa_requirements`** — `id, item_id, epic_id, task_num, deployment_run_id, qa_kind, qa_phase, target_env, blocking_mode, requirement_source, success_policy, capability_requirements, suite_id, waived_at, waiver_rationale, waiver_source, plan_id, plan_case_key, case_position, baseline_position, method_id, method_name, runner_id, verdict_path, host_baseline, entry_surface, required_completion, workflow_transition_id, instructions, expected_outcome, method_config, execution_target_json, execution_target_digest, created_at`
  - Requirements describe what passing looks like; verdicts and raw results live on qa_runs (joined via qa_requirement_id). Reviewed-implementation gate verifies a passing run exists per requirement; running the test suite alone does not satisfy the gate. Blocking state is `blocking_mode`; there is NO `is_blocking` column. Primary key is `id`, not `requirement_id`; requirement rows do not carry `status` or `last_known_result`. `capability_requirements` is a canonical JSON array of capability kinds; `[]` means the case has no capability prerequisite. The aggregate discriminator is `qa_kind` (values like `ac_verification` / `implementation_review`) — there is no `kind` and no `requirement_type` column; requirement provenance is `requirement_source` (`explicit` / The runner a case selects is `runner_id` (values `worktree_run` / `ci_run` / `browser_substrate` / `host_control` / `agent_mission`); it is NOT named `executor_id`, and plain `executor` on this table is a stale guess — that word now names harness identity only, on `harness_sessions.executor`. `ac_derived` / ...). Materialized executable cases instead carry immutable case ordering, runner, entry-surface, completion, instructions, expected-outcome, and method-config snapshots plus one environment/tenant/project execution target. The target digest prevents endpoint or environment substitution after materialization. Execute a transition's ordered set through `yoke qa plan run --item PREFIX-N --transition T`, or one snapshot through `yoke qa case run --requirement-id <id>`; never replace snapshot fields during execution. Canonical unsatisfied-verification SELECT: `SELECT qr.id, qr.qa_kind, qr.method_id, qr.expected_outcome, qr.method_config, qr.blocking_mode FROM qa_requirements qr WHERE qr.item_id = %s AND qr.qa_phase = 'verification' AND qr.waived_at IS NULL AND NOT EXISTS (SELECT 1 FROM qa_runs qrun WHERE qrun.qa_requirement_id = qr.id AND qrun.verdict = 'pass')`.
- **`qa_runs`** — `id, qa_requirement_id, performed_by, qa_kind, verdict, verdict_reason, score, confidence, raw_result, duration_ms, started_at, completed_at, created_at, execution_status`
