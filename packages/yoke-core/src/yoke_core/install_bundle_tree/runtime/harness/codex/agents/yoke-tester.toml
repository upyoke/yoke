- _Branch / commit / CI inspection (read-only)_
  - `git -C $(git rev-parse --show-toplevel) status --short --branch
git -C $(git rev-parse --show-toplevel) log --oneline -20
yoke github-actions check-ci $(yoke projects github-binding status --project yoke --field github_repo) ci.yml --branch main --project yoke
git -C $(git rev-parse --show-toplevel)/.worktrees/PREFIX-N status --porcelain
git -C $(git rev-parse --show-toplevel)/.worktrees/PREFIX-N rev-parse HEAD`
  - Use -C with absolute path. Worktree paths under .worktrees/<branch>. The CI advisory dispatches github_actions.check_ci through gh_rest_transport; pass --head-sha for release authorization tied to one commit (bearer-token REST). After a failed CI gate, read failed-step output with `yoke github-actions failed-log <repo> <run-id> --project <project>` or omit the run id and pass `--workflow ci.yml` with optional `--head-sha` resolved from the lane checkout. Never expand a visible short SHA by guessing: resolve a reported or handed-off full commit hash with `git -C <checkout> rev-parse HEAD`, then verify it with `git -C <checkout> cat-file -e '<sha>^{commit}'`. For a GitHub REST verb that lacks a friendly helper, use `gh_rest_transport.RestRequest` with `request_with_retry`; do not guess a `github_actions_rest.rest_delete` helper.
- _Field-note channel: log a failed/new/unclear recipe or observation_
  - `yoke ouroboros field-note append --kind failed --evidence 'R-CL-03 path-claim-narrow recipe used --remove; actual flag is --drop-paths' --correlation-id polish-run-2026-05-20`
  - **When you hit a recipe gap, fire `yoke ouroboros field-note append` immediately — before retrying, before moving on.** Kind: failed (recipe ran, wrong result), new (recipe missing), unclear (recipe present, unclear purpose). Run `yoke ouroboros field-note append --help` for the worked failure modes and decision tree. Surfaces in /yoke curate via OuroborosFieldNoteAppended events.
- _Apply a structural patch without duplicate or stale hunks_
  - `Use one `*** Update File:` operation per path per patch; consolidate every hunk for that path under the same operation.`
  - Re-read a hook-mutated file before composing a follow-up patch. Commit hooks may reformat the lane and invalidate earlier context.
- _Subagent communication through its registered parent_
  - `In-process subagents see receipts shared with their parent read-only and communicate with the parent through the harness-native parent/subagent channel. They never send, acknowledge, or cancel Fleet messages, never execute a receipt command visible in the parent envelope, and never handle Fleet wake requests. Independently launched top-level workers remain Fleet participants.`
  - Fleet messages belong to the registered top-level session. Only the registered top-level session may send, acknowledge, or cancel Fleet messages or handle Fleet wake requests.
- _Where to put a project Python script_
  - `# put it under the project's tracked tools directory — never /tmp/*.py`
  - Python's `sys.path[0]` for `python3 /tmp/foo.py` is /tmp, not cwd, so project imports may fail. Use a tracked project path or the project's environment runner. Prefer the canonical `yoke` CLI adapter (`yoke items structured-field replace --stdin`) for one-off structured-field writes.
