- **`deployment_flows`** — `id, project_id, name, description, stages, on_failure, created_at, target_tier, target_environment_id, done_description, status`
  - Deployment-flow definitions keyed by TEXT `id`. Project lookup uses numeric `project_id`; join projects for the slug. The human flow name is `name`. `status` is `active` or `disabled`; disabled definitions remain readable for historical runs but cannot be assigned or start new runs. `target_tier` is `persistent` (with `target_environment_id` referencing `environments.id` — JOIN environments for the display name), `ephemeral` (per-run preview substrate), or NULL (merge-only); there is no `target_env` label column (stale guess). `stages` is a JSON-array column whose elements define the ordered pipeline steps. A `human-approval` stage names who may approve with `approvals: {roles, actors}` — the same address shape as workflow `policies.approval_defaults` (roles `owner`/`operator`/`admin`, optional named actor ids). Operator create/update refuses a human-approval stage that omits that address. Canonical lookup: `SELECT id, stages FROM deployment_flows WHERE id = ?;` then `json.loads(stages)` to walk the stage list.
- **`deployment_runs`** — `id, project_id, flow, target_tier, target_environment_id, release_lineage, status, current_stage, created_at, started_at, completed_at, created_by, carried_work`
  - One row per deployment-flow execution. Primary key is the TEXT `id` (run identifier like 'run-YYYYMMDD-NNN'); the `flow` column joins to `deployment_flows.id`. There is no `item_id` column on this table. Item-bound delivery joins through `deployment_run_items`. Use `deployment_runs.id` in raw run queries; do not look for a `run_id` column on the run table (that column lives on `deployment_run_items`). Normal hosted releases are item-bound; zero-member runs are reserved for explicit environment administration and still advance this run row. To read what any succeeded run actually shipped, inspect the `carried_work` JSON object: `items` are attribution matches, `commits` are unresolved bare SHAs, and `derivation.reason` names an explicit empty result. It is independent of member lifecycle. To approve an executing run whose current flow stage uses the `human-approval` executor, use `yoke deployment-runs approve RUN-ID [--note TEXT]`; the run stage is authoritative and Yoke synchronizes member item stage caches atomically. To find the active deploy run for an item, JOIN through `deployment_run_items`: `SELECT dr.id, dr.status, dr.current_stage, dr.target_environment_id FROM deployment_runs dr JOIN deployment_run_items dri ON dri.run_id = dr.id WHERE dri.item_id = ? ORDER BY dr.created_at DESC LIMIT 1;`. Stale-run HCs scan rows where `status` is non-terminal but `started_at` is older than the configured cutoff; item-less is suspicious only when a run never starts. New run creation locks `deployment_runs` in Postgres, computes the UTC day's maximum numeric suffix plus one, and inserts under the same transaction with the primary key as a collision guard. `runs next-id` is only a non-reserving preview.
- **`deployment_run_items`** — `run_id, item_id, added_at`
  - Many-to-many linkage between deployment_runs and items. Composite primary key is `(run_id, item_id)`. Canonical JOINs: `dri.run_id = dr.id` reaches the parent run, `dri.item_id = items.id` reaches the linked item. See the deployment_runs entry above for the full active-run query. Do not require a row here for environment-level deploy runs; zero rows means no attached backlog item, not a broken run once `deployment_runs.status` has moved past `created`.
- **`path_snapshots`** — `id, project_id, commit_sha, built_at`
  - Path snapshot header keyed by `id`. Snapshot timestamp is `built_at`; there is NO `created_at` column on this table.
- **`project_capabilities`** — `id, project_id, type, verified_at, created_at, settings`
  - Project capability rows keyed by `(project_id, type)`. The same commands and capability resolution apply to every project slug; every registered project is an ordinary project row, and specialized behavior comes from capabilities, environments, and workflow definitions rather than project-name checks. The capability-name column is `type` (values include `github`, `docker`, `domain`, `migration_model`, `test_environment`, and `github-actions-runner-fleet`); `test_environment` holds `uv_project`, `uv_extras`, and `uv_groups`, while test trees stay on Project Structure `test_roots` (wrong guess — a parallel roots capability); `settings` is a JSON blob carrying capability-specific configuration. The `github-actions-runner-fleet` network settings use `deployment_ssh_environments` for active VPS environment selectors and `deployment_ssh_stack_names` for explicit standalone VPS Pulumi stack references. The renderer merges and deduplicates them, binding environment stacks to `originElasticIpAddress` and standalone VPS stacks to `vpsElasticIpAddress`; neither output nor a literal address is guessed from the stack name. Canonical non-sensitive settings access is `yoke projects capability-settings get --project <slug> --cap-type <type>`, except that capability listings may include `pulumi-state` and its aggregate settings read is closed. Declare an exact `pulumi-state.stacks` entry through the typed capability-settings merge surface, initialize that declared stack through `yoke pulumi exec`, and fetch its exact rendered program with `yoke projects pulumi-stack-config get --project <slug> --stack <name> --output <owner-only-file>`. Full writes use the exact returned text with `capability-settings set ... --base <as-read-json>` (or `--new` for an absent row); single-path repairs use `capability-settings merge ... --set key.path=value`. These registered surfaces work over HTTPS, protect against lost updates, and run capability-specific typed canonicalization before mutation. Unknown fields on typed capabilities are refused so a mixed-version control plane cannot silently drop new authority fields. GitHub settings remain binding-owned. `pulumi-state` accepts only known typed keys; its generic get/full-set/operator-state merges are closed. Aggregate-read callers must use typed declaration merge, stack initialization, or exact stack-config fetch according to their intent. Every environment `pulumi.origin_vps_stack_name` is an exact standalone VPS stack-config target sourced from that environment's first `servers` entry, not the renderer primary. Its exact `pulumi-state.stack_state[stack_name]` entry must provide operator state; missing state refuses rather than borrowing. For a live stack without legacy site settings, register the exact checkpoint entry with `yoke projects pulumi-state checkpoint-import --project <slug> --stack <name> --checkpoint-file <0600-export> [--apply]`; it is dry-run-default, conflict-refusing, and returns only redacted digests. The render-authorized registered stack-config result is metadata-only; `yoke projects pulumi-stack-config get --project <slug> --stack <name> --output <file>` fetches the body via no-store into a 0600 file. For a new explicitly declared stack, the client-local/source-dev bootstrap is `yoke pulumi exec --project <slug> --stack <name> -- init --secrets-provider 'awskms://<kms-alias>?region=<region>'`. It materializes a 0700 scratch workspace, requires the exact `stacks` declaration, and persists typed operator-state; no repo-local infrastructure checkout is required. Then use `yoke pulumi exec --project <slug> --stack <name> -- <preview|refresh|import|up|stack output NAME ...>`; single-name output reads never allow `--show-secrets`; `up` is local/operator-only and requires both `--yes` and `--non-interactive`. Local AWS and GitHub authority comes from capability files and the selected service binding. Actions keeps AWS OIDC; runner-fleet gets its narrow repository token from the hosted broker. The diagnostic all-capability SQL shape remains `SELECT type, settings FROM project_capabilities WHERE project_id = ?`; routine reads use the registered command instead. The Python workhorse is yoke_core.domain.projects_capabilities_settings; do not import settings helpers from projects_capabilities (wrong guess — that module owns capability listings and secrets). There are NO `project`, `capability_type`, `capability`, `key`, or `value` columns; those are stale guesses for this table.
- **`capability_secrets`** — `id, project_id, type, key, value, source, created_at`
  - Secret-value metadata for project capabilities. The capability discriminator column is `type`, not `capability_type`; keys such as `access_key_id`, `secret_access_key`, and other capability-defined names may appear in `key`. GitHub authentication does not read this table: project authority comes from `project_github_repo_bindings`, installation tokens are short-lived, and the App private key is control-plane-only. `aws-admin` secrets and `ssh.private_key` are machine-local files under `~/.yoke/secrets/capability-secrets/<project>/<capability>/` and should not be read from or written to this table. For DB-backed rows, `source` must be `literal`; file/env-backed secret rows are not a live storage shape. Resolve the project slug to `projects.id`, then query by `project_id`. Canonical lookup: `SELECT type, key, source FROM capability_secrets WHERE project_id = ? ORDER BY type, key;`. Do not print `value` in agent logs.
- **`github_app_installations`** — `installation_id, api_url, account_id, account_login, account_type, repository_selection, permissions, status, last_verified_at, last_error, created_at, updated_at`
  - Control-plane GitHub App installation state keyed by the TEXT `installation_id`; there is no numeric `id` column. `permissions` is a JSON object, `api_url` is the verified GitHub deployment API base, and `status` is active, pending, suspended, or deleted. Join project bindings on `installation_id`; never read App private keys or user refresh credentials from this table.
- **`project_github_repo_bindings`** — `project_id, installation_id, repository_id, api_url, github_repo, default_branch, repository_is_private, status, permissions, last_verified_at, last_error, created_at, updated_at, last_sync_at, last_sync_outcome, last_sync_error`
  - One GitHub App repository binding per project, keyed by INTEGER `project_id`. `repository_id` and `installation_id` are TEXT identifiers; `api_url` is the verified GitHub deployment API base; `permissions` is a JSON object. Binding lifecycle changes do not rewrite the project's explicit `projects.github_sync_mode`; automation availability is derived from installation, permission, and binding status. `last_sync_at`, `last_sync_outcome`, and `last_sync_error` are durable terminal receipts from actual project-scoped GitHub REST automation, not binding time. The wrong guessed table name `project_github_bindings` does not exist; use this `_repo_` table. Registered functions are `projects.github_binding.bind`, `projects.github_binding.lifecycle`, `projects.github_binding.status`, and `projects.github_binding.unbind`; lifecycle is an internal, service-token-only hosted webhook boundary that requires the stable numeric project id and exact installation and repository ids. `installation_id`, `repository_id`, and `project` are accepted either as JSON numbers, the way GitHub's own API and a project id are naturally encoded, or as their decimal strings; the payload contract canonicalizes both forms to the stored TEXT identifier, so a caller never has to stringify GitHub ids before sending. Sync-mode drift is repaired through `projects.github_sync_mode.repair`.
- **`migration_audit`** — `id, migration_name, description, tables_declared, expected_deltas, pre_row_counts, post_row_counts, pre_fk_violations, post_fk_violations, backup_path, state, failure_reason, exception_reason, source_fingerprint, rehearsed_at, lease_id, test_copy_path, baseline_verify_result, author_verify_result, session_id, model_name, project_id, started_at, completed_at, duration_ms, actor_id, worktree, source_branch, source_commit, integration_target, change_class`
