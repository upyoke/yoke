### DB Quick Reference — project (test commands, project_structure)

**Wrapper commands (prefer over raw SQL):**

- _Inspect, get, or update a project Pack_
  - `yoke packs <list|get|update> --help`
  - List works over every transport; get/update take `<pack> <checkout> --project <project> [--version V] [--apply]`. Preview is default. Apply writes project-owned source and .yoke/packs.json; update three-way-merges customizations and reports conflicts. The repository receipt outranks its timestamped DB projection.
- _Read one branch preview environment_
  - `yoke ephemeral-env get <project> <branch> --json`
  - Registered read ephemeral_env.get (works over https). The result contains the environment row, including status, url, workflow run, ports, and deployed SHA. Use the actual worktree branch; do not guess a PREFIX-N branch or read the table directly.
- _Read the project's default deployment flow_
  - `yoke project-structure deploy-defaults get --project <project>`
  - Registered read project_structure.deploy_defaults.get works over https. Empty stdout means no project default is configured; do not invoke the raw deploy_defaults module.
- _Update an ephemeral environment row field_
  - `yoke ephemeral-env update <env-id> status healthy`
  - Registered write ephemeral_env.update (works over https). Use for status, workflow_run_id, url, and deployed_sha updates on ephemeral_environments rows; the handler preserves cmd_update semantics including stopped_at auto-set for terminal statuses. Do not teach the retained domain-update command for lifecycle writes.
- _Migrate legacy Pulumi operator state_
  - `yoke projects pulumi-state migrate --project <project> --site <site-name> --stack <stack> [--apply]`
  - Migration is dry-run-default and exact-set, persists a durable retry marker, and returns redacted metadata. Stack-config registration is render-authorized and metadata-only; fetch its body through the no-store boundary with `yoke projects pulumi-stack-config get --project <project> --stack <stack> --output <file>`; execute it with `yoke pulumi exec --project <project> --stack <stack> -- preview` (also allows refresh and safe file-form import). Actions keeps AWS OIDC; runner-fleet obtains a narrow repository token from its hosted broker, while other stacks use repository-bound App authority. Local runner-fleet recovery may add `--bootstrap-local-authority`; other stacks and Actions refuse it. Local AWS authority comes from the machine capability store. Generic capability and operator-state surfaces are closed.
- _Execute a capability-owned Pulumi stack command_
  - `yoke pulumi exec --project <project> --stack <stack> -- <init|preview|refresh|import|up|stack output NAME ...>`
  - This is a client-local tool-shaped boundary, not a dispatcher function. Its canonical CLI adapter is `yoke_cli.commands.adapters.pulumi`; the execution workhorse is `yoke_core.tools.pulumi_exec`. Never guess a sibling `commands/pulumi_exec.py` module. The selected stack must be declared in the project pulumi-state capability. Output reads require one exact output name and never expose secret values. Every run opens on stderr with a `rendering <checkout> @ <revision> (<infra/ state>)` line naming the tree the program was read from, so read it before trusting an unchanged count; uncommitted work under `infra/` is rendered and reported rather than ignored. There is no `--cwd`: the render root is the project's resolved checkout. Standing in a second working tree of that same repository refuses before any resource summary; run from the named checkout, or bind the tree with `yoke project register <checkout> --project-id <id>`. A child `401 Bad credentials` on api.github.com is `github_provider_unauthorized`: the github.Provider credential GitHub rejected, not AWS, and not proof the launch GITHUB_TOKEN expired (wrong guess — a process token can already read the same variables and environments). Restore with `yoke github status` and `yoke projects github-binding status --project <project> --json`; if those are healthy, replace or update the stack provider so refresh reads the process token.
- _Register a live Pulumi checkpoint's operator state_
  - `yoke projects pulumi-state checkpoint-import --project <project> --stack <stack> --checkpoint-file <owner-only-export> [--apply]`
  - Use this typed dry-run-default boundary when an already-live stack has no legacy site settings to migrate. The CLI reads the 0600 checkpoint locally, extracts only the awskms provider and encrypted data key, and returns a redacted receipt. Never copy another stack's operator state or write stack_state through raw SQL or generic capability-settings surfaces.
- _Init a checkout and create a private GitHub remote_
  - `yoke project git bootstrap CHECKOUT --project <project> --yes`
  - Client-local project.git.bootstrap; default dry-run. Wrong guess: wizard-only git init.

**Schema cheat sheet:**

