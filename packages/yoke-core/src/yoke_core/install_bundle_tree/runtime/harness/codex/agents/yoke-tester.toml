### DB Quick Reference — claims (sessions, work, paths)

**Wrapper commands (prefer over raw SQL):**

- _Lookup live claim holder for an item_
  - `yoke claims work holder-get PREFIX-N`
  - Registered read surface (function id `claims.work.holder_get`) for the live holder. Returns item -> claim row -> session row link. **Artifact writes require owning the item claim** — spec, body sections, File Budget, path-claim register/widen/narrow/release, and GitHub issue-body edits are shared coordination state, work writes governed by the same item-claim ownership as code edits. The session id returned here is a coordination identifier, not authority to mutate as that holder; copying it into `--session-id S` grants no capability over that holder's claim. To reach the holder, address the item.
- _Acquire a work claim (canonical agent shape — target variants)_
  - `yoke claims work acquire --item PREFIX-N --reason draft-in-progress
yoke claims work acquire --epic-id 833 --task-num 5 --reason engineer-dispatch
yoke claims work acquire --process DOCTOR --project yoke --reason scheduled-run`
  - Reason recommended on acquire, required on release. Pick exactly one target variant. Optional --session-id S is a self-identity assertion that the caller IS the named session; it is not cross-session authority. Steering claims are project-scoped work claims: `yoke claims steering acquire --project P [--doc SLUG] [--reason TEXT]`. Acquire atomically pairs the seat with that document (default `CURRENT-PLAN`) and leaves neither claim behind when either is held elsewhere. Inspect with `yoke claims steering list --project P --active-only`; finish with `yoke claims steering release CLAIM_ID --reason TEXT`, which releases the paired document too; direct release of that document is refused while the seat is active. Stale-session reclaim frees both. The itemless loop is `/yoke steer SLUG [--project P]`: a strategy doc is required (offer to create if absent), the document lock releases before a Blitz can claim it, workers launch CLI-only and item-bound (never `/yoke do`), workers are addressed with `yoke say --item PREFIX-N --stdin` (`--actor LABEL` reaches a human member; a whole `--session UUID` only for claim-less recipients) and answer the seat by ROLE with `yoke say --steering` — never a session id: it resolves at delivery, parks with no live seat, and drains to the next seat on acquire, which refuses any OVERLAPPING live scope. Its address is the item you hold, else the one you last held in this session, so a DONE still resolves after close-out released the claim; send it before releasing a claim you still hold, and one terminal report per session and item reaches the seat once however many routes carried it. A steering-LAUNCHED session sends far less than that: the Stop hook already delivers the last assistant text of each of its turns to the seat — the turn after close-out included — so its turn-end text IS the report and must never be re-sent with `yoke say`. It carries only a turn naming something to act on; one ending in a wait or status note is recorded as `SteeringReportSkipped`, not delivered. An operator-launched or operator-opened session is not relayed and reaches the seat with `yoke say --steering` when it must act. Answers carry substantive updates only (never progress ticks — the send path refuses those as `body_not_substantive`), and the fleet report arrives appended to the messages this session receives — one combined report covering every live steering claim, available work first, then idle holders, starved delivery, unregistered launches, items landed without close-out, dead waits, and mail awaiting a seat; pull it between wakes with `yoke steering report get` (optional `--project P` keeps a single scope).
- _Claim → mutate → release (generic plan-stage edit)_
  - `yoke claims work acquire --item PREFIX-N --reason edit
printf '%s' "$NEW_CONTENT" | yoke items structured-field replace PREFIX-N --field spec --stdin
yoke claims work release --item PREFIX-N --reason edit-complete`
  - For section / addendum updates use `yoke items structured-field section-upsert`. The release form `--item PREFIX-N` looks up the calling session's active claim on that item; pass `--claim-id N` directly for explicit form.
- _Operator override: release a stranded foreign-session work claim_
  - `Use the operator break-glass claim-release surface named in the Atlas.`
  - Human-only override for when ANOTHER session holds the claim. Use this — NOT `yoke claims work release --session-id <foreign>`, which is self-only and the claim-boundary lint blocks as spoofing. `--reason` IS the operator rationale (recorded verbatim on the `OperatorClaimOverride` audit event); no `--override-rationale` flag on this surface. Refuses to run with YOKE_HOOK_EVENT set. Pick by who-am-I: holder -> `yoke claims work release --item PREFIX-N --reason TEXT` (self-release); not holder -> the Atlas-listed break-glass release.
- _Release a work claim + manual spec-rewrite pattern_
  - `# Canonical agent shape — release the calling session's active claim:
yoke claims work release --item PREFIX-N --reason TEXT
yoke claims work release --claim-id <id> --reason TEXT
yoke claims work release --epic-id E --task-num K --reason TEXT
yoke claims work release --all-mine
# Manual spec-rewrite pattern (acquire → edit → release):
yoke claims work acquire --item PREFIX-N --reason rewrite-in-progress
yoke items structured-field replace PREFIX-N --field spec --stdin < PATH
yoke claims work release --item PREFIX-N --reason rewrite-complete`
  - The acquire → structured-field replace → release sequence composes existing primitives — no new skill required. Use the epic-task form for one task claim and `--all-mine` for session-scoped handoff cleanup. Process keys come from `yoke_core.domain.work_processes` (STRATEGIZE | FEED | DOCTOR).
- _Release a work claim when this session is ending and a fresh session will continue_
  - `yoke claims work release --item PREFIX-N --reason session-handoff-fresh-session`
  - Use when the item's lifecycle status is NOT terminal but this conversation is ending in a way Yoke cannot detect as definitive (operator opening a fresh session, ending a working block, context-budget pause). The hook cleanup path (end_session_if_empty) only ends claim-free chain-free sessions — it never releases claims for you — so explicit release is the canonical handoff shape. For terminal handoffs (handoff-to-polish, handoff-to-usher, finalize-exit), the lifecycle transition itself releases — do not use this recipe there. Pair with a Progress Log entry so the fresh session inherits resume context.
- _Controlled handoff to a fresh session (Progress Log append → release claim)_
  - `# 1. Append resume context to the Progress Log section:
yoke items progress-log append PREFIX-N --headline 'handoff-to-fresh-session' --content "<resume-context-body>"
# For multiline context, replace --content with --content-file PATH.
# 2. Release the work claim explicitly:
yoke claims work release --item PREFIX-N --reason session-handoff-fresh-session`
  - Two-step shape: capture resume context with the append-only Progress Log surface (handler stamps timestamp + merges with existing entries; accepts `--content` or `--content-file`); release the claim explicitly so the fresh session can acquire (use `yoke claims work release --item PREFIX-N --reason session-handoff-fresh-session` for one item or `yoke claims work release --all-mine` for every liveness-bound claim this session still holds; sticky resource claims survive). The harness owns session lifetime — Stop / SessionEnd hooks run the hook-runner cleanup helper; subagents never terminate sessions themselves (the pre-tool lint `lint_no_agent_session_end` refuses agent-dispatched shutdown-helper invocations). Never read the Progress Log section via shell and pipe it back through `sections upsert` — that destructive read-merge-write is caught by the structured-transform lint; `yoke items progress-log append` is the canonical agent shape. Skip the release step only when the same conversation will resume under the same session_id (transient signals — laptop sleep, app reload — where SessionEnd reactivation auto-reacquires).
- _List path claims for an item_
  - `yoke claims path list --item PREFIX-N`
  - Registered read surface. Returns id, state, declared paths, target_ids.
- _Register a path claim (canonical agent shape)_
  - `yoke claims path register \\
  --item PREFIX-N \\
  --paths <project-source-path>/path_claim_targets.py,<project-test-path>/test_path_claim_targets.py,docs/event-catalog.md \\
  --integration-target main --mode exclusive --allow-planned`
  - --allow-planned for files not yet committed. --mode exception for no-repo-touch work items.
- _Widen a path claim (canonical agent shape)_
  - `yoke claims path widen --claim-id 138 --item PREFIX-N \\
  --add-paths <project-source-path>/service_client_backlog_router.py,<project-test-path>/test_backlog_github_backfill_oversized.py \\
  --reason 'backfill subcommand wiring touches router + new test file'`
  - <claim-id> is the path_claims.id from path-claim-register response or `yoke claims path list`.
- _Narrow a path claim (drop or keep paths)_
  - `Path-claim narrow is an operator-debug/refine disposition; use `yoke claims path widen` for additive scope changes.`
  - No public narrow wrapper is taught here. Route scope shrinkage through refine/claim reconciliation until a registered adapter exists.
- _List / get path claims_
  - `yoke claims path list --item PREFIX-N
yoke claims path get 138`
  - Registered read surfaces. Returns id, state, declared paths, target_ids. Pipe JSON output to jq for filtering.
- _Summary of path-claim conflicts on a branch_
  - `yoke path-claims conflicts list --integration-target main --project P`
  - Registered read-only summary across all non-terminal claims. An explicit `--project` satisfies resolution from any mapped checkout; do not fall back to `yoke db read` against path_claims when the named project was already supplied. Write-side checkout binding is unchanged.
- _Find conflicts on specific paths (SQL)_
  - `yoke db read "
SELECT pc.id, pc.owner_kind, pc.owner_item_id, pc.state, tgt.path_string
FROM path_claims pc
JOIN path_claim_targets pct ON pct.claim_id = pc.id
JOIN path_targets tgt ON tgt.id = pct.target_id
WHERE tgt.path_string IN ('<project-source-path>/foo.py', '<project-source-path>/bar.py')
  AND pc.state NOT IN ('cancelled','released')"`
  - Raw diagnostic read. Use when path-claim-conflicts is too coarse; `db_router query` is only the source-dev/operator-debug break-glass fallback.
- _Classify a path-claim overlap before authoring a coordination edge_
  - `yoke claims path coordination-decision-build --item PREFIX-N --conflicting-claim CLAIM_ID --paths a.py,b.py`
  - Registered read-only surface; works over HTTPS. Returns a JSON evidence packet with both items' specs, the conflicting claim's state + path metadata, and three ready-to-paste commands (one per decision option: `coordination_only`, directional `activation`, operator `escalate`). The helper does NOT decide; the caller classifies and runs the matching command. Most independent same-file edits resolve as `coordination_only` via `yoke items dependency add ... --gate-point coordination_only --rationale TEXT`.

**Schema cheat sheet:**

- **`harness_sessions`** — `session_id, executor, executor_surface, presentation_surface, presentation_state, presentation_mode, presentation_source, presentation_observed_at, provider, model, reasoning_effort, context_window_tokens, requested_model, requested_reasoning_effort, requested_context_window_tokens, mode, parked_reason, keepalive_until, keepalive_reason, execution_lane, offer_envelope, current_item_id, current_item_set_at, recent_item_id, recent_item_status, recent_item_recorded_at, actor_id, project_id, offered_at, last_heartbeat, turn_posture, turn_posture_at, ended_at, terminated_at, terminated_by_actor_id, terminated_by_session_id, termination_reason, last_tool_call_at, tool_call_count, episode_started_at, pending_resume_notice, last_chain_step, last_checkpoint_at`
  - model / reasoning_effort / context_window_tokens hold ONLY provider-attested served truth read from the harness artifact. Per harness: claude reads model + effort from its transcript (message.model, effort) and context_window_tokens from the ONLY surface that states a window, the status line command's stdin JSON (context_window.context_window_size), which yoke_harness.claude_status_line records per session for the next hook event to relay — claude hook payloads and transcript rows carry usage and never a window, so a session whose status line has not run yet reports a model with the window still NULL; codex reads all three from its rollout (turn_context + model_context_window); cursor reads model (and effort, spelled in the variant name) from its conversation store modelName and attests NO window at all, a declared deferral with its evidence in yoke_contracts.session_context_window_sources. Read that module rather than guessing whether a harness can attest a window; it also names which harnesses record the window separately from the model, the reason a claude session keeps reporting one after its model has settled. A session settles only when a hook carrying the served model COMPLETED against the control plane, so a relay that failed open or timed out leaves the facts unsettled and the next hook re-sends them; a NULL model is never a client that gave up. NULL means not attested. A stale guess is that model holds what the session was launched with: that is requested_model, with requested_reasoning_effort / requested_context_window_tokens (claude-opus-5[1m] is only ever a request — no provider returns a tier selector). Stamped once, from the session env at registration AND from the launch record at launch binding (a pre-warmed pool serves a launch from a process older than it, so the child cannot read its own ask); a later write fills a gap, never rewrites. Never write a request into a plain column; a NULL plain column falls back to requested_model only with a label (model_display). executor stores only the canonical harness_id enum values claude-code, codex, or cursor (resolved at write time via yoke_harness.hooks.identity.canonical_harness_id); the surface-specific alias (claude-desktop, claude-vscode, claude-cli, codex-desktop, codex-vscode, codex-cli, cursor-desktop, cursor-cli) lives in executor_surface when known and is NULL otherwise. Rendering prefers it and falls back to executor; event-envelope executor fields are canonical-only. The primary key is `session_id` — there is Observed presentation is independent: presentation_surface records Remote Control only when bounded client state proves it; state/mode/source/observed_at describe the latest material transition, guessing no frontend or initiator. NO `id` column on this table (stale guess). Primary attribution key is current_item_id, written ONLY by the work-claim lifecycle: set when this session acquires an item work claim, and archived to recent_item_id (re-pointed at the session's newest remaining item claim) when that claim is released, reclaimed, handed off, or its item goes terminal. A stale guess is that filing or updating an item sets it: touching an item without claiming it records recent_item_id alone, so a filing or steering session never works the item. recent_item_id / recent_item_status / recent_item_recorded_at carry the most recent item worked after current_item_id clears. mode is the session's queue posture (session_mode.SESSION_MODES); parked_reason is the required why when mode is parked and stays until an explicit mode stamp leaves parked. No tool call unparks (stale guess). keepalive_until / keepalive_reason are a DIFFERENT concept from parked and are not interchangeable with it (a stale guess is that parked is what keeps an idle session alive): they are a bounded lease another caller takes to stop idle cleanup ending a session that legitimately holds nothing, taken with `yoke sessions keepalive hold <session-id> --reason ...`, cleared by `yoke sessions keepalive release` or by expiry. The held session's own tool calls neither set nor clear it. Read a live hold through session_keepalive_holds (an expired timestamp is not a hold), never by testing keepalive_until for NULL. offer_envelope is the JSON session-offer payload (see JSON-nested-field schemas below). The default routing lane is execution_lane on this row; session-offer uses it unless the caller supplies --lane / request body execution_lane, which overrides the row and emits SessionOfferLaneOverrideApplied. That override is for a DELIBERATE operator re-route only: an agent never resolves a lane of its own, because a lane guessed locally outranks the project's session-routing mapping and filters every frontier item behind a lane no lane_paths entry declares. Read the row back with `yoke sessions identity`, which returns this row's resolved identity plus the lane's permitted paths, and pass none of it onward. actor_id is bound AT REGISTRATION and is never NULL on a row this build wrote: the verified bearer-token actor over https, otherwise the universe's operating actor (the single human actor, or the one labeled with the machine's OS login). Registration refuses with a named SESSION_ACTOR_* reason rather than storing NULL, because an actor-less session cannot register a path claim. Legacy session-attribution column names predate the typed work-claim model and are NOT on this table. There is NO `status` column on harness_sessions; use mode for queue posture and recent_item_status for the most recent item lifecycle snapshot. There is NO `active` column; use ended_at / terminated_at / last_heartbeat plus work_claims for liveness and ownership. There is likewise NO `state` column — the posture column is `mode` and the recent-item lifecycle snapshot is `recent_item_status`, neither named `state` — and NO `started_at` column: the session-offer timestamp is `offered_at`, with liveness / teardown on last_heartbeat / ended_at. terminated_at is the permanent do-not-reactivate / do-not-wake terminal state; its actor, session, and reason columns record the authority that set it. Derived liveness has THREE states (active|stale|ended) — there is NO `terminated` liveness value and no --liveness terminated: a killed session reads liveness='ended' with ended_cause='killed', and the roster narrows it with --ended-cause killed|wound_down. Every refusal (register, wake, deliver) reads terminated_at directly, never the liveness word. Native turn posture is first-class state: turn_posture is running|waiting|unknown and turn_posture_at orders accepted hook/activity observations independently of claims, chain progress, and ended_at. Tool-call liveness is first-class state: last_tool_call_at / tool_call_count are stamped by the observe pipeline on each HarnessToolCallCompleted/Failed — read these columns, never MAX(events.created_at) (the events ledger is telemetry-only). episode_started_at is the current-episode boundary (stamped at register and reactivation; who-claims --current-episode resolves from it). pending_resume_notice is the render-once slim resume-block payload (written at reactivation, cleared at render). Chain progress is likewise first-class state: last_chain_step / last_checkpoint_at are stamped by update_chain_checkpoint on every ChainStepCompleted and survive offer-envelope rewrites — read them instead of MAX(step) over ChainStepCompleted envelopes (that state previously lived only in event envelopes; the events ledger is telemetry-only). project_id is the session's client-resolved project identity, stamped from the installing machine's checkout mapping at registration. workspace is display/debug context only; never join or prefix-match workspace against a shared project row to infer project identity. The sessions.begin entrypoint input helps canonicalize executor identity during registration; it is not stored in an `entrypoint` column, and harness_sessions has no such column.
- **`session_tool_calls`** — `id, session_id, tool_use_id, tool_name, started_at, completed_at, outcome, command_summary`
  - Rolling per-tool-call state (short retention, ~7d via the events prune). The observe pipeline opens a row on HarnessToolCallStarted and closes it (completed_at + outcome) on the completion event; open rows (completed_at IS NULL) are the orphan set the session-end sweep closes with outcome='interrupted'. command_summary is the bounded (500-char) command text the pre-tool-call lint guardrails scan. Unique key (session_id, tool_use_id). This table is state, not telemetry — the matching HarnessToolCall* events remain in the events ledger for audit queries.
- **`work_claims`** — `id, session_id, target_kind, scope, claim_type, claimed_at, last_heartbeat, released_at, release_reason, reason, reason_intent, release_reason_intent`
  - Every typed target uses target_kind plus one canonical JSON object in scope: item={"item_id":N}, epic_task={"epic_id":N,"task_num":N}, process={"process_key":K,"conflict_group":G}, steering={"project_id":N}, migration_serialization={"project_id":N,"model":M,"item_id":N}, qa_admission={"machine_id":ID}, or route_qualification={"project_id":N,"grant_key":K}. Domain validation requires exactly the keys for the named kind. Steering has one live session-owned seat per project; strategy-document locks remain in strategy_doc_claims. The last three kinds are the shared-operation claims that replaced the retired lease table it replaced: migration territory per model, one physical test machine, one private-route qualification grant. They are STICKY — the stale-session sweep and session-end release skip them, because the resource keeps running after the session goes quiet, so recovery is the human-only `yoke coordination-claim release --project P --key K --reason R`. Their exclusivity unit is the whole scope except migration_serialization, which conflicts on (project_id, model) so item_id records the owner rather than the resource. Read and address them by their operator key (LIVE_DB_MIGRATION:<model>, QA_HOST:<machine>) via `yoke coordination-claim list [--active-only]`. There is no specialized target column or target_path column; worktree/path coverage lives elsewhere. claim_type is 'exclusive'; non-terminal state is derived from released_at IS NULL, with no state/status column. Primary key is id; there is no claim_id column. The claim timestamp is `claimed_at`, not `created_at`. For holder lookups prefer `yoke claims work holder-get PREFIX-N`; for a path use `yoke claims work holder-get --path /abs/path`. Writing into another live session's lane is refused (failure_class=foreign_lane, event SessionCwdForeignLaneDenied); holding no claim is not permission. Two processes in one worktree share its git index. Canonical active-session query: `SELECT id, target_kind, scope, claimed_at FROM work_claims WHERE session_id = ? AND released_at IS NULL`. Acquire/release intent is row state: reason is the verbatim acquire rationale, reason_intent its canonical classification, and release_reason_intent the caller's release intent versus the release_reason enum. Read these columns, never the telemetry-only events ledger; NULL means no intent was recorded. A session serializing behind another item must not treat the peer's status as the landing signal — status is what strands after a cap-overruled close-out. The durable landed facts are the merge receipt, items.merged_at / merge_queue_landed_at, and git ancestry of the merge sha.
- **`path_claims`** — `id, state, mode, owner_kind, owner_item_id, owner_session_id, owner_work_claim_id, registered_by_actor_id, registered_by_session_id, integration_target, base_commit_sha, registered_at, activated_at, released_at, cancelled_at, release_reason, cancel_reason, blocked_reason, exception_reason`
  - State enum: 'planned' | 'active' | 'released' | 'cancelled' | 'blocked'. Typed ownership is explicit: owner_kind ∈ ('item','session','process') and the matching one of owner_item_id / owner_session_id / owner_work_claim_id is populated. An item-owned claim survives the registering session ending. HC-path-claim-owner-kind flags non-terminal rows that lack typed ownership or carry contradictory owner_kind / owner-field combinations. Lookup by item via `yoke claims path list --item PREFIX-N`. Covered-path list is an API response field, not a column — there is no `path_claims.paths`, `path_claims.path`, or bare `path` column (stale guesses). It is reachable only by JOIN through path_claim_targets -> path_targets.path_string. Canonical JOIN: `SELECT ptarget.path_string FROM path_claims pc JOIN path_claim_targets pct ON pct.claim_id = pc.id JOIN path_targets ptarget ON ptarget.id = pct.target_id WHERE pc.owner_kind = 'item' AND pc.owner_item_id = ? AND pc.state = 'active'`. Activation records the integration-target head SHA on `base_commit_sha` (TEXT). Non-terminal predicate is `state IN ('planned', 'blocked', 'active')`; terminal is `state IN ('released', 'cancelled')`. Do NOT use `released_at IS NULL` to filter path_claims for non-terminal rows — cancelled rows carry `released_at = NULL` with only `cancelled_at` set, so the `released_at IS NULL` predicate would include them. Use the `state` predicate above. Canonical SELECTs: all non-terminal item-owned claims on an item — `SELECT id, integration_target, state, mode, registered_at FROM path_claims WHERE owner_kind='item' AND owner_item_id = ? AND state IN ('planned', 'blocked', 'active')`; all currently-active path claims on an integration target — `SELECT id, owner_kind, owner_item_id, owner_session_id, owner_work_claim_id, mode, activated_at FROM path_claims WHERE integration_target = ? AND state = 'active'`.
- **`path_claim_targets`** — `id, claim_id, target_id, declared_at`
  - Join table: path_claims (claim_id) -> path_targets (target_id). The covered-path list for a path claim is this join (path_targets.path_string carries the file path). There is NO `path_claim_id` column and NO `path` column.
- **`path_claim_task_bindings`** — `claim_id, epic_id, task_num, bound_at`
  - Durable task scope for item-owned path claims. A row binds path_claims.claim_id to the generated Epic task identified by (epic_id, task_num). The binding carries no session or work-claim column: registering-session provenance is not path authority, and task coverage survives a session handoff. Worker enforcement intersects bound claim targets with epic_task_files; a persisted item_worktrees.lane_role='integration' lane receives their union.
- **`path_targets`** — `id, project_id, kind, path_string, generation, parent_target_id, created_at, materialization_state, materialization_updated_at, planned_by_item_id, planned_by_claim_id`
  - Path-snapshot rows. path_string is the canonical relative path (e.g. '<project-source-path>/foo.py'). kind is 'file' or 'directory'. materialization_state is 'observed' (exists on integration target) or 'planned' (claim-minted future file via --allow-planned). There is NO `path` column; use `path_string`.
- **`path_claim_amendments`** — `id, claim_id, amended_at, amendment_kind, payload, reason`
  - Append-only history of widen / narrow / cancel-amendment operations on a path_claims row. amendment_kind names the operation; payload is JSON (e.g. {'added': [target_id, ...]}); reason is the operator-authored rationale.
- **`actors`** — `id, kind, system_component, created_at`
  - Actor identity referenced by work_claims.actor_id, path_claims.registered_by_actor_id, and similar foreign keys. kind is 'human' or 'system'; system_component is the bound component name when kind is system-attributed. Human-readable names live in actor_labels as surface-specific projections: display for generic actor views, github_label for GitHub sync. actors has NO org_id column; resolve an actor's organization membership through actor_org_roles.org_id.
- **`actor_labels`** — `id, actor_id, surface, label, created_at`
  - Surface-specific actor labels. surface='display' is the generic actor-facing display projection; surface='github_label' is the GitHub sync projection. One label per actor per surface on every surface. One actor per surface/label pair only on the resolution surfaces (github_label): display labels are names, so two actors may carry the same one. Write a display label with actor_display.set_actor_display_name, which upserts; actors.set_actor_label binds once and no-ops on a relabel.
- **`harness_machine_reports`** — `project_id, harness_id, glue_written, glue_present, glue_malformed, config_present, project_entry_present, approval_state, unattended_posture, reported_at`
  - PK (project_id, harness_id). No machines, project_installs, or harness_installs table. approval_state is approved|unapproved|not_applicable|unknown; orange is unapproved (every normalized .codex/hooks.json handler must match trusted_hash under the literal hooks-file path). Write via harness.machine_report.upsert. unattended_posture is unattended|prompts|absent and answers whether a session the operator opens in that harness runs yoke without an approval prompt; 'absent' means the harness is not installed on the reporting machine, never that it is configured.

**JSON-nested-field schemas** (_parse the rendered JSON string; do NOT query nested fields as top-level columns_):
- `harness_sessions.offer_envelope` — `execution_lane`:str='primary', `supported_paths`:list[str]=[], `capabilities`:list[str]=[], `workspace`:str='', `offered_at`:str (ISO-8601)='', `offer_diagnostics`:dict={}. Validator: `yoke_core.domain.sessions_offer_envelope_merge.merge_offer_envelope`.

