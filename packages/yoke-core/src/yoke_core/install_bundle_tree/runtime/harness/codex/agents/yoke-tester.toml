  - `yoke workflow-item epic-progress-note append --epic 1704 --task-num 5 --note-num 3 --body-file PATH
yoke workflow-item epic-progress-note list --epic 1704 --task-num 5 --limit 10
yoke workflow-item epic-task submission-receipt-get --epic 1704 --task-num 5 --after-note-count 2`
  - The append adapter accepts --body-file PATH, preferred over stdin. note_num is monotonically increasing per (epic, task); inspect the current high-water mark with submission-receipt-get or the progress-note list.
- _Update epic-task status / metadata field via CLI_
  - `yoke workflow-item epic-task update-status --epic <epic-id> --task-num <task_num> --status <status>
yoke workflow-item epic-task metadata-update --epic <epic-id> --task-num <task_num> --fields-json '{"max_attempts": 2}'`
  - `update-status` dispatches workflow_item.epic_task.update_status (epic work claim required; syncs the GitHub label) and accepts the lifecycle vocabulary: planning, plan-drafted, planned, implementing, reviewing-implementation, reviewed-implementation, polishing-implementation, implemented, release, done, blocked, stopped. Terminal success statuses are pipeline-owned and refused (`pipeline_required`). `metadata-update` writes selected epic_tasks fields; valid fields include title, context_estimate, dependencies, status, dispatch_attempts, body, github_issue, item_worktree_id, max_attempts, agent_id, last_heartbeat. dependencies is comma-separated TEXT containing prerequisite task_num values from the same epic, not JSON. For body content prefer `yoke workflow-item epic-task body-replace`; for status changes from a skill, prefer the orchestrator-routed transition (e.g. `yoke conduct epic-task update-status`) so the gate + cascade fire.
