  - `uv run --frozen python3 -m yoke_core.tools.module_source_path yoke_core
uv run --frozen python3 -m yoke_core.tools.watch_pytest -- <project-test-path> -q`
  - Fallback shape. `yoke watch pytest -- <paths>` already binds the worktree in a uv-managed checkout. Use the command from the linked worktree when the interpreter's editable install could still point at main, or when an externally-managed Python blocks `python3 -m pip install -e .`. Confirm the printed `yoke_core.__file__` path is under the worktree before trusting a green test run.
- _Re-render agent files after editing packet seeds_
  - `uv run --frozen python3 -m yoke_core.domain.agents_render render --target-root <checkout>`
  - After editing any `schema_api_context_*.py` seed file (`commands_core`, `tables_python_helpers`, etc.) or any canonical agent body, run the renderer or `test_byte_identity` fails. The renderer writes the installed Claude, Codex, and Cursor agent adapters from the seeds. Drift check: run `uv run --frozen python3 -m yoke_core.domain.agents_render check --target-root <checkout>`. Use the explicit `--target-root` form from linked worktrees; implicit cwd-based render targets are refused there.
- _authored-file line limit (file_line_check)_
  - `yoke check file-line --staged`
  - Sanctioned local lint tool (not function-call backed). The default cap is 350 lines and a project overrides it with a `file_line_limit=N` key in `.yoke/project.config` (checked in, read off disk, so the offline hook agrees); comparison is `new <= limit` (so the limit itself is allowed). Rules: new files over the limit fail; existing under-cap files crossing upward fail; existing over-cap files growing further fail. When near the cap, prefer compressing the same file (collapse multi-line returns, drop one-line `__all__` lists, fold duplicate teaching) or split into a sibling module. `file_line_exception` entries are for intentionally unsplittable artifacts or non-authored data; do NOT add hard-rule files like AGENTS.md / CLAUDE.md. The pre-tool `hint_file_line_limit_approach` advisory warns on Write that would push a tracked authored file over the cap.
- _Run pytest with background watcher (main session)_
  - `yoke watch pytest --impacted main --bounded
# Default local check (--bounded is a no-op). Full sweep (CI's job; local --widen / CI-outage fallback) — pass your project's test anchors:
yoke watch pytest --print-streaming-pair -- <project test anchors>
# Paste both printed lines verbatim into the harness's background + progress-tail surfaces — the printed --raw-capture/--progress-capture flags are what bind the run to the tail.
# After completion: tail -80 <raw-capture> (the helper-resolved path the wrapper printed)`
  - The impacted selection is the local default and needs no project-specific paths. The full sweep is CI's job on every pull request and push to main, and locally it is the CI-outage fallback; its anchor paths are per-project — read them from your project's registered verification command (its QA plan) or your project rules file, and never carry another project's anchors over. Both inject xdist `-n auto`. Pass `-n 0` after `--` for sequential order-sensitive debugging. The wrapper mints the raw + progress capture pair via yoke_core.domain.project_scratch_dir.mint_watcher_capture_pair under the machine temp root's watcher-captures directory and prints the resolved paths; --raw-capture <path> is the operator carve-out for pinning to a known location. Running the wrapper without the printed capture flags mints a different pair, so the tail follows a file the run never writes and refuses once its grace window passes. Subagents must run the foreground variant below — backgrounded watchers from subagent context are denied by lint-subagent-background. `uv run --frozen` materializes the locked dev environment in a clean worktree, so the wrapper and application dependencies are importable without ambient PYTHONPATH or virtualenv activation.
- _Run pytest foreground inside one tool call (subagent)_
  - `yoke watch pytest -- <project-test-path>/test_my_module.py -q
# Blocks within the same tool call; the wrapper mints raw + progress captures via project_scratch_dir.watcher_capture_path under the machine temp root's watcher-captures directory and prints them; tail -80 <raw-capture> on failure.`
  - Subagent tool-call turns are atomic — backgrounded watcher patterns strand processes. Enforced by lint-subagent-background.
- _Run doctor with background watcher (main session)_
  - `yoke watch doctor --print-streaming-pair -- --quick
# Paste both printed lines verbatim — the printed --raw-capture/--progress-capture flags bind the run to the tail.`
  - Doctor must run under this wrapper — bare invocations risk the inverted-redirection trap (`2>&1 > file` silently drops stderr). The wrapper writes raw + filtered captures and auto-exits on its sentinel.
- _Run merge or done-transition with watcher (main session)_
  - `yoke watch merge --print-streaming-pair merge-worktree -- PREFIX-N
# merge-item enqueues and exits; a launched worker adds --wait`
  - watch_merge owns the merge filter regex (section banners, step headers, errors, warnings, RESULT_FILE=). Use for any merge or done_transition; never hand-author the filter. merge-item --wait holds the landing inline: an operator-opened session takes the enqueue/re-enter handoff, while a launched headless worker passes --wait through this wrapper and holds its turn, because it cannot be prompted on the landing-complete message. Never block a bare foreground call on the full wait.
- _Wait on a commit's CI runs with watcher (main session)_
  - `yoke watch ci-run
yoke watch ci-run -- <branch-or-sha> --workflow <name>`
  - Owns the CI filter; never hand-author one. Resolves the ref with `git rev-parse <ref>^{commit}`, matches that exact head SHA, and matches --workflow against the workflow name, not the run title.
- _Run pytest with explicit raw-capture path (post-completion inspection)_
  - `yoke watch pytest --raw-capture <PATH> -- <project-test-path>/test_my_module.py -q
tail -80 <PATH>`
  - --print-streaming-pair mints the capture path automatically via project_scratch_dir.mint_watcher_capture_pair (machine temp root watcher-captures/...); the explicit --raw-capture <PATH> form is the operator carve-out for callers that want a known path (CI scripts collecting artifacts). Prefer the helper-resolved default.
- _Run doctor focused on specific HC rules_
  - `yoke watch doctor -- --quick
yoke watch doctor -- --only HC-event-registry-coverage,HC-event-callsite-registry-sync
yoke watch doctor -- --full --json`
  - --quick = fast subset; --only takes a comma-separated list of HC slug ids for targeted reruns; --json for machine output. Doctor CLI surface, not a wrapper-only flag.

**Schema cheat sheet:**

- **`items`** — `id, title, workflow_id, workflow_version_id, workflow_posture, generated_task_membership_finalized_at, status, priority, project_id, project_sequence, github_issue, frozen, blocked, blocked_reason, deployment_flow, deploy_stage, source, owner, created_at, updated_at`
  - Backlog row keyed by global bare-integer id for internal joins. The primary key is `id`; items has NO `item_id` or `public_id` column. `item_id` is a foreign-key column on OTHER tables. To resolve a public `PREFIX-N` ref in raw SQL use `WHERE project_id = <p> AND project_sequence = <n>` (join `projects` for the prefix); never treat the N from a public ref as `WHERE id = N` — `id` and `project_sequence` drift. `WHERE id = <n>` is correct only when the caller already holds the internal id. Public item refs are project-scoped: join `items.project_id` to `projects.id` and render `{projects.public_item_prefix}-{items.project_sequence}` inside project context; the old item-level project slug field has been deleted. The GitHub linkage is the single `github_issue` column — there is no `github_issue_number` and no `github_url`. The lifecycle columns are the immutable `workflow_id` / `workflow_version_id` pin and the current `status`. `workflow_posture` is the item's selected posture JSON, written at create and amended afterwards through `workflows.item_posture.amend` (`yoke workflows item-posture amend PREFIX-N ...`); wrong guesses: that the create-time selection is final, and that `yoke qa item-plan attach` can select verification on an item that has none. `generated_task_membership_finalized_at` durably records the generated-task membership snapshot, including an empty set. There is NO `kind` column on items — the function-call envelope's `target.kind` discriminator (`item|epic_task|qa_requirement|session|process`) is the dispatcher's row-type tag, not an items column. Use `workflow_id` for the registered workflow identity. Project authority is `project_id` joined to `projects.id`; `project_sequence` is the per-project public item number. items.body is a virtual rendered field (use `items get PREFIX-N body` or read the structured-field columns directly): spec, design_spec, technical_plan, worktree_plan, shepherd_log, shepherd_caveats, test_results, deploy_log, db_mutation_profile (`items.get.run` nests under `result.fields`; wrong guess: top-level `db_mutation_profile`), db_compatibility_attestation, architecture_impact, resolution, resolution_ref, resolution_comment, spec_updated_at, spec_updated_by, merged_at, deployed_to. Worktree branches and paths live exclusively in item_worktrees; task and dispatch rows reference those lanes through item_worktree_id.
- **`epic_tasks`** — `id, epic_id, task_num, title, status, body, dependencies, item_worktree_id, last_activity_at`
  - Keyed by (epic_id, task_num). NOT item_id, NOT task_number, NOT seq, NOT depends_on, NOT description. last_activity_at is first-class task freshness — stamped by every epic-task mutation surface (status transitions, body/field updates, progress notes, epic-task claim acquire/release); chain_head_freshness reads it for /yoke conduct re-entry. dependencies is comma-separated TEXT containing prerequisite task_num values from the same epic, not JSON. item_worktree_id references the authoritative lane in item_worktrees. Task recency previously lived only in task-scoped event rows — read this column, never the events ledger (telemetry-only); NULL means no mutation recorded.
- **`epic_dispatch_chains`** — `id, epic_id, item_worktree_id, queue, current_index, current_task, current_attempt, max_attempts, no_chain, started_at, last_updated`
  - One row per epic-task fan-out lane. Unique on (epic_id, item_worktree_id). queue is a JSON array of task_nums; current_task is the head task being worked. Conduct's task activation refreshes current_task / current_attempt / last_updated when it sets epic_tasks.status='implementing' so telemetry and scheduler views see the live dispatch.
- **`epic_progress_notes`** — `id, epic_id, task_num, note_num, body, created_at`
  - Append-only. NOT note (the content column is body).
- **`item_dependencies`** — `id, dependent_item_id, blocking_item_id, gate_point, satisfaction, source, session_id, rationale, evidence_json, created_at`
  - Directional edges between items. The dependent waits on the blocker per gate_point ('activation', 'integration', 'closure', or 'coordination_only' — the last attests compatible same-file edits with no lifecycle gate). dependent_item_id/blocking_item_id are integer FKs to items.id. API/list still project PREFIX-N. The gate categorization is `gate_point`; there is NO `classification` column on this table. satisfaction accepts 'status:done', 'status:implemented', 'fact:merged', or 'fact:deployed:<environment-name>'; deployed facts require a succeeded run for the blocker's project/environment whose carried_work names the blocker. source enum: conduct, feed, idea, migration, operator, refine, shepherd. Reader `items.dependency.list` projects `direction`/`other_item` (wrong guess: result keys `dependent_item`/`blocking_item` — storage is *_item_id).
- **`events`** — `id, event_id, source_type, session_id, severity, event_kind, event_type, event_name, event_outcome, org_id, actor_id, environment, service, project_id, item_id, task_num, agent, tool_name, duration_ms, exit_code, trace_id, anomaly_flags, tool_use_id, turn_id, hook_event_name, envelope, created_at`
  - Append-only TELEMETRY ledger — diagnosis/audit only, never application state. Status/transition questions read `item_status_transitions`; board activity reads `item_activity_days`; board/Overview code meters read `project_code_days`; strategize/drift anchors read `strategy_checkpoints`; session/tool-call liveness reads `harness_sessions` columns + `session_tool_calls`; dispatcher idempotency reads `function_call_ledger`; path-claim override gating reads `path_claim_overrides`; the DB-claim reviewed-negative attestation reads `items.db_mutation_profile` (reviewed_negative key). The event-specific payload lives under `$.context.*` inside `envelope` (top-level envelope keys are metadata like `$.event_id` / `$.event_name`); the structured outcome string lives in `event_outcome`; the timestamp lives in `created_at`; project authority is numeric `project_id` joined to projects. `item_id` is TEXT (bare-numeric text — quote in SQL as `'<id>'`, never INTEGER). `$.context.detail.actor_role` is present on subagent-delegated tool-call events and absent on parent-turn calls. Working forensic SELECT examples (all runnable via `yoke db read "..."`): filter by (item_id, event_name) — `SELECT event_name, event_outcome, created_at FROM events WHERE item_id = '<id>' AND event_name = 'WorkClaimed' ORDER BY created_at DESC`; recent events by session_id — `SELECT event_name, event_outcome, created_at FROM events WHERE session_id = '<session-id>' ORDER BY created_at DESC LIMIT 25`.
- **`event_registry`** — `event_name, event_kind, event_type, owner_service, description, context_schema, severity_default, added_in, status`
  - Event catalog keyed by `event_name`. There is NO `name` column on this table; use event_name for joins and lookups.
- **`ouroboros_entries`** — `id, timestamp, agent, context, category, body, reviewed_at, archived_at, created_at, project_id, target_project_id`
  - Learning-log / field-note rows. The kind-like discriminator is `category` and the evidence/content text is `body`; there are NO `kind` or `evidence` columns on this table. Two project columns, both numeric; join projects for the human slug. `project_id` is where the note was OBSERVED (resolved automatically from the calling checkout). `target_project_id` is where the fix BELONGS, set only when the author declares it (`--target-project` on append) and NULL otherwise — it is never inferred. Promotion picks the caller's explicit project, else `target_project_id`, else `project_id`. `agent` holds the author label the write path resolved (subagent role, else the session's executor) — it is NOT an actor id, and there is no `author` or `actor_id` column. Supersede links live in `ouroboros_entry_corrections`, not in a column here. Use `created_at` for canonical ordering; `timestamp` is legacy compatibility.
- **`item_sections`** — `item_id, section_name, content, ordering, created_at, updated_at, source`
  - Per-item section rows that render into items.body alongside the structured fields. Composite key (item_id, section_name); section_name is case-sensitive. ordering controls render order (Progress Log uses 200; NULL still renders). Read/write via `yoke items section get` / `upsert` / `delete`, or the `items.progress_log.append` function-call which preserves prior content. There is NO `heading` column.
- **`item_gate_satisfactions`** — `id, item_id, obligation, rung_id, target_status, detail, facts, recorded_at, recorded_by_session_id`
  - One row per (item_id, obligation) recording WHICH rung of that obligation's satisfier ladder discharged it — the durable answer to 'was this done merged with CI, merged locally, or merely attested'. Obligations: 'path_claim_boundary' (remote_integration_ref, local_integration_ref), 'done_merge_evidence' (merged_with_ci, merged_locally, agent_attested), 'delivery_evidence' (deployment_run_succeeded, merge_only). The project-scoped 'integration_trunk' lookup has no item identity and declares itself resolution-only in the ladder model. `facts` is a JSON {fact_key: present|absent|unknown} snapshot. Rows are upserted, never appended. Read via item detail's `gate_satisfactions` key; writes go through the internal `gate_satisfier.rung.resolve` function (wrong guess — no `item_gate_rungs` table, no CLI adapter for the resolve call).
- **`project_derived_facts`** — `id, project_id, fact_key, present, fact_value, observed_at, observed_from`
  - Project truth nobody declared but the control plane observes about itself, converged at every item-scoped ladder resolution and `project.snapshot.sync`. `fact_key` values: 'remote_present', 'default_branch', 'test_command_declared', 'environments_present'. Ladders read these under the `derived:` prefix, alongside `declared:` capability rows, `item:` per-item control-plane observations, and `observed:` facts the calling machine probes. A resolution-only lookup can observe a missing row live; the next item gate persists it. UNKNOWN is reserved for a genuinely unreadable or unowned fact.
- **`yoke_core.domain.worktree`** — `paths db, paths main, paths yoke-root, create`
  - Source-dev path resolver, not an agent-facing command. Agents should rely on registered `yoke ...` surfaces, explicit worktree paths from dispatch context, and git/worktree metadata instead of resolving Yoke control-plane authority through a path helper. The retired DB-path mode exists only as a refusal guard for stale SQLite recipes. Never import a guessed `get_db_path` helper; no such importable name exists.
- **`yoke_core.domain.db_helpers`** — `iso8601_now, connect, query_rows, query_one, query_scalar`
  - Legacy compatibility helper surface. Agents should prefer registered `yoke <subcommand>` surfaces for control-plane access. There is NO `read_only=` keyword on `connect` and NO `get_canonical_conn` importable name on this module — those are wrong guesses the live denial log has captured. There is also NO `resolve_db_path` helper; that name was retired when DB authority moved to Postgres — call `connect()` with no path. The standalone FastAPI route-module connector is `connect`; importing `yoke_core.api.main.get_db_readonly` from a route module is a wrong guess because it re-enters app construction and creates a circular route import. The query helpers (`query_rows`, `query_one`, `query_scalar`) remain for compatibility while Postgres-native callers move through router-owned surfaces.
- **`runtime/harness/<harness_id>/manifest.json`** — `agent_wake, session_control, supports`
  - The harness manifest is where harness capability truth lives — not any doc, skill, rules file, or agent body. Before stating what a harness can do, read the field: `agent_wake` answers whether it can be woken while idle and by which primitive (idle_wake / idle_wake_mechanism / timer_wake, each with the evidence behind it), `session_control` answers messaging and launch routes, `supports` answers hook affordances. Schema: runtime/harness/manifest-schema.md. Sources: yoke_contracts.harness_wake_capability and yoke_contracts.session_control; the manifests are rendered, so never hand-edit one. A capability nobody probed reads `unverified` — that is an answer, not a gap to fill by guessing.

**JSON-nested-field schemas** (_parse the rendered JSON string; do NOT query nested fields as top-level columns_):
- `items.db_mutation_profile` — `state`:'none'|'declared'='none', `model`:str|null=null, `mutation_intent`:'apply'=null, `compatibility_class`:'pre_merge_safe'|'pre_merge_breaking'=null, `migration_strategy`:'additive_only'|'hard_cutover'|'expand_contract'=null, `migration_modules`:list[str]=[]. Validator: `yoke_core.domain.db_mutation_profile.validate_json_string`.
- `items.db_compatibility_attestation` — `pre_merge_readers_writers`:list[dict]=[], `invariants`:list[str]=[], `rehearsal_commands`:list[str]=[], `residual_risk_notes`:list[str]=[], `class_escalations`:list[dict]=[], `frozen_at`:str|null=null. Validator: `yoke_core.domain.db_compatibility_attestation.validate_json_string`.

