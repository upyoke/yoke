[build-system]
# Exact backends keep PEP 517 builds reproducible. setup.py validates the
# public docs corpus while it builds the install-bundle tree, which needs the
# Markdown, YAML and line-wrapping libraries at the versions uv.lock resolves.
requires = [
    "setuptools==83.0.0",
    "setuptools-scm[toml]==10.2.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pygments==2.20.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "yoke-core"
dynamic = ["version"]
description = "Yoke core — server runtime and the single source of control-plane authority"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
  "maxminddb>=3.0,<4",
    "yoke-contracts",
    "yoke-cli",
    # Installed harness implementations supply the engine's declared runtime
    # interfaces. Shared contracts own those interfaces; core domain code
    # never imports an implementation package. The reverse dependency stays
    # forbidden: yoke-harness never imports yoke-core.
    "yoke-harness",
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "pydantic==2.13.4",
    # Release tooling parses and validates PEP 440 versions and PEP 508
    # product-sibling requirements in built wheel metadata.
    "packaging>=24,<27",
    # CommonMark tokens provide the public docs heading and link contract.
    "markdown-it-py>=4,<5",
    # libsodium binding — encrypts GitHub Actions secrets (sealed-box ciphertexts).
    "pynacl>=1.5.0,<2.0",
    # Postgres driver, declared on yoke-core: the engine (and this driver)
    # ships in every product install. Database access is controlled by DSN
    # possession, not driver absence — https-transport machines hold no DSN
    # and never dispatch in-process.
    "psycopg[binary]>=3.1,<4",
    # PostgreSQL's grammar validates operator repair statements before execution.
    "pglast>=7,<8",
    # Cloud core-service resolves its current Aurora password from the
    # RDS-managed Secrets Manager secret instead of carrying a static DSN file.
    "boto3>=1.35,<2",
    # OpenTelemetry transport/correlation for cloud runtime observability.
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    # OIDC id_token signature verification against the provider's JWKS
    # (PyJWKClient + RS*/ES* decode). The [crypto] extra brings the
    # `cryptography` backend the asymmetric algorithms require. Chosen over
    # authlib: the browser sign-in door only needs discovery + code
    # exchange (stdlib urllib) + token verification, not a full OAuth
    # client framework surface.
    "PyJWT[crypto]>=2.8,<3",
    # Registrable-domain lookup for the attribution site domain: the bundled
    # Public Suffix List maps app.upyoke.com to upyoke.com without network.
    "publicsuffixlist>=1.0,<2",
    # The frontend collector classifies browser, OS and device type from the
    # request User-Agent with the maintained uap-core parser.
    "ua-parser[regex]>=1.0,<2",
]

[project.entry-points."yoke.runtime"]
handler_registry = "yoke_core.api.handler_registry_runtime"
structured_dispatch = "yoke_core.api.service_client_structured_api_adapter"
main_checkout_sync = "yoke_core.engines.main_checkout_sync"
runs_continue_for_item = "yoke_core.engines.runs_continue_for_item"
lane_base_update = "yoke_core.engines.lane_base_update"
done_transition_gates = "yoke_core.engines.done_transition_gates"
deploy_run_worktree_naming = "yoke_core.engines.deploy_run_worktree_naming"
deploy_run_worktree_retirement = "yoke_core.engines.deploy_run_worktree_retirement"
runs_start_for_item = "yoke_core.engines.runs_start_for_item"
standalone_item_merge_engine = "yoke_core.engines.standalone_item_merge_engine"
terminal_lane_cleanup = "yoke_core.engines.terminal_lane_cleanup"
done_transition_runner = "yoke_core.engines.done_transition_runner"
worktree_maintenance = "yoke_core.engines.worktree_maintenance"
migration_merge_preflight = "yoke_core.domain.migration_merge_preflight"

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.8.0",
    "filelock>=3.29.4,<4",
    "httpx==0.28.1",
]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The universe UI runtime and its declaration-emitting host contract ship in
# the wheel; the server exposes only the closed static asset roster.
# The published workflow canon is data the server reads at boot to recognize a
# universe's stored definitions. A wheel without it cannot tell a published
# generation from a corrupted row, so it ships alongside the code that reads it.
"yoke_core.domain" = [
    "installer_exploration_cases.json",
    "builtin_workflow_canon/*.json",
    "migrations/*.json",
]
"yoke_core.ui" = ["static/*", "contracts/*"]
"yoke_core.frontend_events" = ["attribution_rules.json"]
# yoke_core.install_bundle_tree is not package data: setup.py builds it from
# the repo-root sources into the wheel (yoke_core.domain.install_bundle_tree_build).

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "*.pyc"]
