name: yoke-tests-selection

# One change-scoped pytest selection, dispatched by `yoke watch pytest`
# (yoke_core.tools.pytest_remote_selection_run) for a project that declares
# its CI workflow. Every runner recomputes the impacted selection from
# (base_sha, head_sha) with the same code the wrapper uses locally, so the
# test list is a function of the two commits, not of a working tree.
#
# Every selection shard is laid out exactly like a yoke-ci test shard: the
# newest supported Python, the shared yoke-test-runner setup, whole-file
# splitting (YOKE_CI_PYTHON_SCOPE), and the timing profile the plan job
# refreshes from retained CI reports the way yoke-ci's repo-contracts job
# does. Shards collect from the suite's own roots and skip unselected files,
# so a selection never collects more than full CI does.
#
# The plan job sizes that selection against the refreshed profile and
# publishes BOTH the matrix fan-out and the split count the shards pass to
# pytest, so the two can never disagree — a matrix narrower than the split
# runs a fraction of the selection and still reports green. A selection full
# CI answers as fast is refused there, before any shard starts, with the
# reason and the full gate's command. Any failed shard fails the run, which
# is the verdict the dispatching wrapper adopts.
#
# Its concurrency group is keyed by dispatch id and never
# cancels: yoke-ci cancels in-progress runs on refs other than main, and a selection
# dispatched on a lane branch must never take that lane's gate down.
#
# GitHub registers a workflow_dispatch workflow only from the DEFAULT branch:
# until this file is on main, the dispatch API answers 404 for it whatever ref
# is requested, and the wrapper reports CI as unreachable and names --local.
# A selection workflow therefore starts working on the merge that lands it,
# never on the branch that adds it. Verified 2026-09-03: while this file
# existed only on its own lane, `gh api
# repos/<owner>/<repo>/actions/workflows/yoke-tests-selection.yml` was 404 and
# the workflow was absent from the repository's workflow listing.
run-name: >-
  ${{ inputs.yoke_dispatch_id
      && format('yoke-tests-selection {0} [yoke-dispatch:{1}]', inputs.head_sha, inputs.yoke_dispatch_id)
      || format('yoke-tests-selection {0}', inputs.head_sha) }}

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit under test; the job checks this out and refuses any other tree.
        required: true
      base_sha:
        description: Merge base the impacted selection is computed against; empty runs pytest_args as given.
        required: false
        default: ""
      pytest_args:
        description: Shell-quoted bare pytest arguments appended to the selection.
        required: false
        default: ""
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.yoke_dispatch_id || github.run_id }}
  cancel-in-progress: false

env:
  # This repository explicitly selects its project; runners have no machine binding.
  YOKE_PROJECT: yoke
  # Public GHCR copy of the official image; refreshed daily by ci-image-mirror.
  POSTGRES_IMAGE: ghcr.io/upyoke/postgres:16

permissions:
  contents: read

jobs:
  plan:
    timeout-minutes: 5
    name: plan
    permissions: {contents: read, actions: read}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      splits: ${{ steps.plan.outputs.splits }}
      python_latest: ${{ steps.fan_out.outputs.python_latest }}
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.head_sha }}
          # Full history: the plan diffs against base_sha.
          fetch-depth: 0

      - name: Read the full suite's Python
        id: fan_out
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards fan-out --write-github-output

      - name: Set up Python
        # The interpreter the shards run on, so the plan's selection and
        # theirs are the same computation. No Postgres and no test run: the
        # plan reads git, the import graph, and the timing profile.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.fan_out.outputs.python_latest }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Build portable product wheels
        run: uv run python -m yoke_core.tools.ci_product_wheels --output "$GITHUB_WORKSPACE/dist/ci-product-wheels"

      - name: Refresh shard timing profile from retained CI reports
        continue-on-error: true # Missing compatible telemetry leaves the committed profile usable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m yoke_core.tools.ci_durations_refresh --target-root .
          --latest --repository "${{ github.repository }}"
          --python "${{ steps.fan_out.outputs.python_latest }}"

      - name: Share the timing profile with every shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-durations
          path: |
            .test_durations
            dist/ci-product-wheels/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Publish the shard fan-out and split count
        id: plan
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: >-
          uv run python -m yoke_core.tools.ci_selection_plan
          --write-github-output
          --base-sha="$SELECTION_BASE_SHA"
          --head-sha="$SELECTION_HEAD_SHA"
          --pytest-args="$SELECTION_PYTEST_ARGS"

  selection:
    # Same budget as yoke-ci's test-shard: a selection may earn every shard
    # the full suite has, so it may need as long as one.
    timeout-minutes: 35
    name: selection (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    strategy:
      # Every shard reports: a cancelled sibling would lose the log and the
      # artifact for tests that were still the selection's own coverage.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # Whole-file splitting, exactly as on yoke-ci's newest-Python leg.
      YOKE_CI_PYTHON_SCOPE: all
      YOKE_CI_PRODUCT_WHEELS: ${{ github.workspace }}/dist/ci-product-wheels
      # The name is run- and shard-scoped so shared self-hosted hosts never
      # collide.
      PG_CONTAINER: yoke-selection-pg-${{ github.run_id }}-${{ matrix.shard }}
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.head_sha }}
          # Full history: the selection diffs against base_sha, and every
          # package derives its version from git via setuptools_scm.
          fetch-depth: 0

      - name: Use the plan's timing profile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-test-durations}

      - name: Prepare the test runner
        uses: ./.github/actions/yoke-test-runner
        with:
          python-version: ${{ needs.plan.outputs.python_latest }}
          pg-container: ${{ env.PG_CONTAINER }}

      - name: Run the selection
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_PYTEST_ARGS: ${{ inputs.pytest_args }}
          # Both from the plan job's one sizing pass, so this shard's split
          # and the matrix that produced it are the same number.
          SELECTION_SPLITS: ${{ needs.plan.outputs.splits }}
          SELECTION_GROUP: ${{ matrix.shard }}
        # Attached `--option=value`, because a dispatched pytest argument is
        # itself dash-prefixed: separated, a lone `-q` reads as another option
        # and the run dies on argument parsing before pytest starts.
        run: >-
          uv run python -m yoke_core.tools.ci_selection_run
          --base-sha="$SELECTION_BASE_SHA"
          --head-sha="$SELECTION_HEAD_SHA"
          --pytest-args="$SELECTION_PYTEST_ARGS"
          --splits="$SELECTION_SPLITS"
          --group="$SELECTION_GROUP"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output-selection-${{ matrix.shard }}
          path: pytest-output.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Stop Postgres
        if: always()
        run: |
          docker rm -f "$PG_CONTAINER" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
