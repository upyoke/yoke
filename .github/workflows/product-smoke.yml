name: product-smoke
run-name: product-smoke [yoke-dispatch:${{ inputs.yoke_dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      browser_unit_tests:
        description: Run browser unit tests on macOS
        type: boolean
        required: false
        default: false
      yoke_dispatch_id:
        description: Yoke standalone QA correlation id
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: product-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ !inputs.browser_unit_tests }}
    name: ${{ matrix.os }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Ubuntu 24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            os: Ubuntu 24.04
            architecture: arm64
          - runner: macos-latest
            os: macOS 26
            architecture: arm64
    steps:
      - name: Disable Git symlink checkout
        run: git config --global core.symlinks false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install build tool
        run: python3 -m pip install uv
      - name: Register Python for clean-environment subprocesses
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' "${pythonLocation}/lib" | sudo tee /etc/ld.so.conf.d/yoke-product-smoke-python.conf >/dev/null
          sudo ldconfig
          env -i "${pythonLocation}/bin/python3" -c 'import sys; print(sys.version)'
      - name: Verify native process identity, reactivation and stop custody
        run: |
          uv sync --all-packages --locked
          export YOKE_MACHINE_HOME="$RUNNER_TEMP/native-custody-machine"
          export YOKE_PG_CLUSTER_ROOT="/tmp/yoke-native-custody-${GITHUB_RUN_ID}"
          mkdir -p product-smoke-evidence
          env -u YOKE_PG_CLUSTER_ROOT uv run --frozen yoke local-postgres start --json > product-smoke-evidence/native-postgres-setup.json
          env -u YOKE_PG_CLUSTER_ROOT uv run --frozen yoke local-postgres stop --json > product-smoke-evidence/native-postgres-stop.json
          trap 'uv run --frozen python -m yoke_core.tools.pg_testcluster stop' EXIT
          uv run --frozen python -m pytest -q \
            runtime/api/domain/test_process_ancestry.py \
            runtime/api/domain/test_process_ancestry_platform.py \
            runtime/api/domain/test_harness_family_identity.py \
            runtime/api/domain/test_session_ambient_identity.py \
            runtime/api/test_yoke_harness_identity_runtime.py \
            runtime/harness/test_hook_helpers_model.py \
            runtime/harness/test_session_process_custody.py \
            runtime/harness/test_session_relay_interactive_holder.py \
            runtime/harness/test_session_relay_claude_idle_hosts.py \
            runtime/harness/test_session_relay_native_turn_custody.py \
            runtime/harness/test_session_relay_recorded_exit_custody.py \
            runtime/harness/test_session_relay_liveness_pruning.py \
            runtime/harness/test_session_relay_liveness_pass_cost.py
      - name: Verify contributor checkout collection and tests
        run: |
          uv sync --all-packages --locked
          export YOKE_MACHINE_HOME="$RUNNER_TEMP/contributor-checkout-machine"
          mkdir -p product-smoke-evidence
          uv run --frozen yoke local-postgres start --json > product-smoke-evidence/contributor-postgres-start.json
          uv run --frozen yoke local-postgres stop --json > product-smoke-evidence/contributor-postgres-stop.json
          uv run --frozen python runtime/api/tools/product_runner_checkout_tests.py --output product-smoke-evidence
      - name: Prepare a missing browser library on the disposable Linux runner
        if: runner.os == 'Linux'
        # Remove Firefox too: otherwise apt swaps the image's Firefox for the
        # snap transitional package, whose install fails on the runner.
        run: sudo -n apt-get remove -y libatk-bridge2.0-0t64 firefox
      - name: Install, onboard, replay hooks, and check source development
        if: runner.os != 'Linux'
        env:
          SMOKE_EXPECTED_OS: ${{ matrix.os }}
          SMOKE_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 runtime/api/tools/product_runner_smoke.py --output product-smoke-evidence
      # Linux relay setup needs a real systemd user manager: run the whole smoke
      # as a disposable account inside its own PAM login session (Linger=no).
      - name: Run Linux smoke in a disposable login account
        if: runner.os == 'Linux'
        run: >-
          echo "runner account linger: $(loginctl show-user "$(id -u)" --property=Linger --value 2>&1)" ;
          sudo -n --preserve-env=GITHUB_ACTIONS "$(command -v python3)"
          runtime/api/tools/product_runner_linux_account.py
          --output product-smoke-evidence --uv "$(command -v uv)"
          --expected-os '${{ matrix.os }}'
          --expected-architecture '${{ matrix.architecture }}'
      - name: Preserve proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-smoke-${{ matrix.runner }}-${{ matrix.architecture }}
          path: product-smoke-evidence
          if-no-files-found: error
          retention-days: 14
  browser-platform:
    if: ${{ inputs.browser_unit_tests }}
    name: browser-unit-tests (macOS)
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install test dependencies
        run: uv sync --all-packages --locked
      - name: Prepare native PostgreSQL for pytest fixtures
        shell: bash
        run: |
          brew install postgresql@16
          echo "YOKE_PG_BIN_DIR=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Verify browser toolchain and process custody
        run: >-
          uv run --frozen python -m pytest -p no:cacheprovider -q
          runtime/api/cli/test_browser_node_toolchain.py
          runtime/api/cli/test_browser_windows_toolchain.py
          runtime/api/cli/test_browser_platform_process.py
