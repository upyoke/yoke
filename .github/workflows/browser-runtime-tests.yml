name: browser-runtime-tests

on:
  workflow_call:

permissions:
  contents: read

env:
  BROWSER_RUNTIME_DIR: packages/yoke-harness/src/yoke_harness/browser_runtime
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-cache

jobs:
  browser-runtime:
    timeout-minutes: 10
    name: browser-runtime
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    services:
      postgres:
        # Official image via the AWS public mirror. services.image cannot
        # read workflow env, so this key is the one declaration.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: yoke
          POSTGRES_PASSWORD: yoke
          POSTGRES_DB: postgres
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect browser-runtime changes
        id: change_scope
        run: |
          base_ref="origin/${{ github.event.repository.default_branch }}"
          base_sha="$(git merge-base HEAD "$base_ref")"
          if git diff --quiet "$base_sha" HEAD -- "$BROWSER_RUNTIME_DIR" \
            packages/yoke-harness/src/yoke_harness/browser_apparmor.py \
            packages/yoke-harness/src/yoke_harness/system_privileges.py \
            packages/yoke-contracts/src/yoke_contracts/browser_qa_contract.py \
            packages/yoke-core/src/yoke_core/domain/browser_qa* \
            packages/yoke-core/src/yoke_core/domain/browser_client_owned_page.py \
            runtime/api/domain/test_browser_qa_color_scheme* \
            .github/workflows/browser-runtime-tests.yml; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Browser runtime unchanged; skipping Node suite."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Browser runtime changed; running Node suite."
          fi

      - name: Set up Node.js
        if: steps.change_scope.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.BROWSER_RUNTIME_DIR }}/package-lock.json

      - name: Install browser-runtime dependencies
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npm ci

      - name: Install Chromium
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Provision Chromium sandbox
        if: steps.change_scope.outputs.should_run == 'true'
        env:
          PYTHONPATH: packages/yoke-harness/src
        # Use the shipped provisioner against this checkout's Playwright builds.
        # Its two real sandbox probes must pass before the daemon suite starts.
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from types import SimpleNamespace
          from yoke_harness.browser_apparmor import ensure_chromium_apparmor

          ensure_chromium_apparmor(
              Path(os.environ["BROWSER_RUNTIME_DIR"]),
              SimpleNamespace(node=Path(shutil.which("node"))),
              env=os.environ.copy(),
              emit=print,
          )
          PY

      - name: Run browser-runtime tests
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npm test

      - name: Set up Python for Browser case integration
        if: steps.change_scope.outputs.should_run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install Browser case integration dependencies
        if: steps.change_scope.outputs.should_run == 'true'
        run: |
          python3 -m pip install uv
          uv sync --all-packages --all-groups --locked

      - name: Run registered Browser case integration
        if: steps.change_scope.outputs.should_run == 'true'
        env:
          YOKE_BROWSER_INTEGRATION: '1'
          YOKE_PG_DSN: host=localhost port=${{ job.services.postgres.ports[5432] }} user=yoke password=yoke dbname=postgres
        # CI owns this disposable checkout and locked environment, as in
        # ci_shards.py; the local source wrapper requires a registered lane.
        run: uv run --frozen python3 -m pytest -n auto runtime/api/domain/test_browser_qa_color_scheme_integration.py
