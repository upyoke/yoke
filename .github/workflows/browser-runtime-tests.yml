name: Browser runtime tests

on:
  workflow_call:

permissions:
  contents: read

env:
  BROWSER_RUNTIME_DIR: packages/yoke-harness/src/yoke_harness/browser_runtime

jobs:
  browser-runtime:
    name: browser-runtime
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect browser-runtime changes
        id: change_scope
        run: |
          base_ref="origin/${{ github.event.repository.default_branch }}"
          base_sha="$(git merge-base HEAD "$base_ref")"
          if git diff --quiet "$base_sha" HEAD -- "$BROWSER_RUNTIME_DIR"; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Browser runtime unchanged; skipping Node suite."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Browser runtime changed; running Node suite."
          fi

      - name: Set up Node.js
        if: steps.change_scope.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.BROWSER_RUNTIME_DIR }}/package-lock.json

      - name: Install browser-runtime dependencies
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npm ci

      - name: Install Chromium
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser-runtime tests
        if: steps.change_scope.outputs.should_run == 'true'
        working-directory: ${{ env.BROWSER_RUNTIME_DIR }}
        run: npm test
