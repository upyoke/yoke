name: session-process-macos

on:
  pull_request:
    paths:
      - 'packages/yoke-contracts/src/yoke_contracts/*process*'
      - 'packages/yoke-contracts/src/yoke_contracts/harness_family_identity.py'
      - 'packages/yoke-harness/src/yoke_harness/session_*'
      - 'packages/yoke-harness/src/yoke_harness/hooks/identity_runtime.py'
      - 'packages/yoke-core/src/yoke_core/hooks/helpers_model.py'
      - 'runtime/api/domain/test_process_ancestry*'
      - 'runtime/harness/test_session_process_custody.py'
      - '.github/workflows/session-process-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-process-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare native Postgres and locked source dependencies
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
          uv sync --all-packages --locked --python 3.12
      - name: Verify identity, reactivation and stop custody
        run: >-
          uv run --frozen python -m pytest -q
          runtime/api/domain/test_process_ancestry.py
          runtime/api/domain/test_process_ancestry_platform.py
          runtime/api/domain/test_harness_family_identity.py
          runtime/api/domain/test_session_ambient_identity.py
          runtime/api/test_yoke_harness_identity_runtime.py
          runtime/harness/test_hook_helpers_model.py
          runtime/harness/test_session_process_custody.py
          runtime/harness/test_session_relay_interactive_holder.py
          runtime/harness/test_session_relay_claude_idle_hosts.py
          runtime/harness/test_session_relay_native_turn_custody.py
          runtime/harness/test_session_relay_recorded_exit_custody.py
          runtime/harness/test_session_relay_liveness_pruning.py
