name: self-host-bootstrap-probe
run-name: self-host bootstrap [yoke-dispatch:${{ inputs.yoke_dispatch_id }}]

# Confirmation only: never scheduled or part of a change/merge gate.
on:
  workflow_dispatch:
    inputs:
      yoke_dispatch_id:
        description: Correlation id for the manual evidence run
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      registry:
        image: registry:2
        ports:
          - 5200:5000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # As in the container CI gate, SCM tags derive the candidate wheel
          # version. A shallow checkout derives a false pre-release version
          # below the history's serving floors, despite carrying current code.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install the candidate's source dependencies
        run: |
          python -m pip install uv
          uv sync --all-packages --all-groups --locked
      - name: Prove boot, private token, authenticated API, restart, and upgrade
        env:
          PROBE_EVIDENCE_DIR: ${{ runner.temp }}/self-host-bootstrap-evidence
        run: uv run --frozen python3 -m ops.self_host_bootstrap_probe
      - name: Retain redacted evidence even when the probe fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-host-bootstrap-evidence
          path: ${{ runner.temp }}/self-host-bootstrap-evidence
          if-no-files-found: error
