name: yoke-ci

# Dispatched runs embed the caller's correlation id in run-name for lost-
# response recovery. FACTORY workflow: read-only GITHUB_TOKEN; never set
# YOKE_LINUX_RUNS_ON on a public fork (that routes strangers onto private
# runners). merge_group runs are the merge queue's one integration gate
# per train of queued PRs; the queue ruleset requires this check on its
# gh-readonly-queue/* refs. Non-queue merges authorize via QA conclusion
# + merge-engine check-run poll; CLA signature-check stays required. Shards
# use hand-launched postgres:16 (fsync off) + pytest-split/xdist; no
# aggregate tail. repo-contracts is the fast-fail tree-only gate before
# shards; main-push and merge_group may skip via reuse-coverage when a
# green run already covered the identical tree oid.
run-name: >-
  ${{ inputs.yoke_dispatch_id
      && format('yoke-ci {0} [yoke-dispatch:{1}]', github.ref_name, inputs.yoke_dispatch_id)
      || format('yoke-ci {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    # paths-ignore is push-only: a skipped required PR check stays pending.
    paths-ignore:
      - ".yoke/strategy/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token everywhere; fork PRs must never see an elevated token.
# reuse-coverage elevates actions:read at job scope only.
permissions:
  contents: read

env:
  # Bound for reuse-coverage: covering runs older than this still force suite.
  REUSE_WINDOW_HOURS: "24"

jobs:
  # Tree-only contracts on one runner before the shard matrix. Shards keep
  # their own copies (defense in depth); this job is the fast-fail front.
  repo_contracts:
    name: repo-contracts
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Run repo contracts
        # One changed-path scope for every event: the merge-base with the
        # default branch. Scoping by event lets a dispatched gate and the
        # pull-request entry run disagree about one tree, and a green gate
        # then stops predicting merge-queue entry.
        run: >-
          uv run python -m yoke_core.tools.ci_repo_contracts
          --base "origin/${{ github.event.repository.default_branch }}"

  reuse_coverage:
    name: reuse-coverage
    # A main push re-proves the tree that produced it; a train carrying one
    # rebased item builds the tree its entry run proved. Skipped jobs report
    # skipped, not absent, so required contexts stay satisfied.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'merge_group'
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      skip_suite: ${{ steps.probe.outputs.skip_suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Probe same-tree coverage
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=packages/yoke-core/src python3 -m
          yoke_core.tools.yoke_ci_tree_reuse --write-github-output

  test_shard:
    name: test-shard
    needs: [repo_contracts, reuse_coverage]
    # Fail open on reuse skip; require repo-contracts success before shards.
    if: >-
      always() && needs.repo_contracts.result == 'success'
      && needs.reuse_coverage.outputs.skip_suite != 'true'
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    env:
      # Hand-launched Postgres (not services:) so fsync can be disabled.
      # Name is run-id + python + shard unique across shared self-hosted hosts.
      PG_CONTAINER: yoke-ci-pg-${{ github.run_id }}-${{ matrix.python-version }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history (NOT shallow). No test reads this repo's own commit
          # history — Yoke's git/merge/worktree tests boot their own tmp repos —
          # so shallow would be test-safe. But every package derives its version
          # from git via setuptools_scm (dynamic version; tag v0.1.0 in history),
          # and a depth-1 clone drops tags+history, collapsing the editable
          # installs to the 0.1.0 fallback. The ~18s a shallow fetch would save
          # isn't worth degraded version derivation.
          # test_ci_builds_container_without_registry_push pins this value.
          fetch-depth: 0

      - name: Reclaim runner disk
        run: >-
          PYTHONPATH=packages/yoke-core/src python3 -m
          yoke_core.tools.github_runner_disk_reclaim
          --runner-environment "${{ runner.environment }}"
          --runner-os "${{ runner.os }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Register libpython with the system loader cache
        # The setup-python interpreter is a --enable-shared build whose libpython
        # lives in ${pythonLocation}/lib. setup-python adds LD_LIBRARY_PATH for
        # normal workflow steps, but tests intentionally spawn python3 with a
        # cleaned env (merge engine, update_status, installer shim,
        # product-boundary probes). Those subprocesses need the system loader
        # cache to know where libpython lives.
        #
        # Matrix lanes can share one self-hosted runner, and ldconfig updates
        # the host-global /etc/ld.so.cache via a fixed /etc/ld.so.cache~ temp
        # path. Serialize the conf write + cache update so parallel lanes cannot
        # race that rename.
        run: |
          lib_dir="${pythonLocation}/lib"
          if ! compgen -G "${lib_dir}/libpython*.so*" >/dev/null; then
            echo "No libpython shared library found under ${pythonLocation}/lib" >&2
            exit 1
          fi

          conf_path="/etc/ld.so.conf.d/yoke-setup-python-${{ matrix.python-version }}.conf"
          sudo flock /var/lock/yoke-ci-ldconfig.lock bash -euo pipefail -c '
            printf "%s\n" "$1" > "$2"
            ldconfig
          ' _ "$lib_dir" "$conf_path"

          # prove a clean-env subprocess can now start the venv interpreter
          env -i .venv/bin/python3 -c "import sys; print('clean-env venv python OK', sys.version.split()[0])"

      - name: Configure git identity (CI runners have no ~/.gitconfig)
        run: |
          git config --global user.email "ci@yoke.local"
          git config --global user.name "Yoke CI"
          git config --global init.defaultBranch main

      - name: Start Postgres (durability off, dynamic host port)
        # Launch the throwaway cluster ourselves so we can disable durability:
        # the data is disposable, so fsync / full_page_writes / WAL streaming are
        # pure overhead that dominate this Postgres-heavy suite's write cost.
        # `-c` server flags are impossible through GitHub `services:`, which is
        # why we run docker directly. Dynamic host port (`-p 5432`, no host side)
        # so two matrix lanes sharing one self-hosted instance never collide on a
        # fixed 5432 ("port is already allocated"). The host port is read back in
        # the next step.
        run: |
          docker run -d \
            --name "$PG_CONTAINER" \
            -e POSTGRES_USER=yoke \
            -e POSTGRES_PASSWORD=yoke \
            -e POSTGRES_DB=postgres \
            -p 5432 \
            postgres:16 \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off \
            -c wal_level=minimal \
            -c max_wal_senders=0

      - name: Resolve Postgres DSN (dynamic host port)
        # `services:` is gone, so read the mapped host port from the container we
        # started. `docker port <name> 5432` prints "0.0.0.0:NNNNN" (plus an IPv6
        # "[::]:NNNNN" line); take the first line and strip everything up to the
        # last colon. Set the DSN for all later steps via $GITHUB_ENV. libpq tries
        # every address `localhost` resolves to, so it connects regardless of
        # whether the IPv4 or IPv6 publish is listed first.
        run: |
          set -o pipefail
          host_port="$(docker port "$PG_CONTAINER" 5432 | head -n1 | sed 's/.*://')"
          if [ -z "$host_port" ]; then
            echo "Postgres host port did not resolve" >&2
            exit 1
          fi
          echo "Resolved Postgres host port: ${host_port}"
          echo "YOKE_PG_DSN=host=localhost port=${host_port} user=yoke password=yoke dbname=postgres" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        # Mirror the local pg_testcluster readiness gate for the GitHub Actions
        # postgres service. conftest's setup_ambient_test_db opens an admin
        # connection at collection time with NO retry, so a transient service
        # hiccup (or the window where pg_isready reports healthy a beat before
        # the postmaster accepts CREATE DATABASE) would otherwise surface as a
        # cryptic xdist collection crash instead of a clear, early failure.
        run: uv run python -m yoke_core.tools.wait_for_pg

      - name: Verify Postgres CREATEDB
        # The suite gives each pytest-xdist worker its own disposable database
        # and creates a fresh one per isolated test. Probe that exact privilege
        # through the same helper the suite uses before the worker fan-out.
        run: |
          uv run python - <<'PY'
          from runtime.api.fixtures.pg_testdb import (
              create_test_database,
              drop_test_database,
          )

          name = create_test_database()
          try:
              print("Postgres CREATEDB preflight OK:", name)
          finally:
              drop_test_database(name)
              print("Postgres CREATEDB preflight dropped:", name)
          PY

      - name: Run pytest
        id: pytest
        run: |
          # The outer shard cuts total wall time; xdist still uses every core
          # inside that shard. least_duration greedily distributes the slowest
          # tests using the committed timing profile.
          # -n auto mirrors DEFAULT_PARALLEL_WORKERS in
          # runtime/api/tools/_pytest_parallel.py (the canonical home the local
          # run_tests / watch_pytest runners read). CI pins flat `auto` on
          # purpose: hosted runners should use all cores, not the RAM-aware
          # cliff that can drop a constrained box to -n 1.
          uv run python -m pytest runtime/api/ runtime/harness/ tests/ \
            -n auto \
            --dist worksteal \
            --splits 4 \
            --group "${{ matrix.shard }}" \
            --splitting-algorithm least_duration \
            --durations-path .test_durations \
            --tb=short \
            --durations=25 \
            --junitxml=pytest-report.xml \
            2>&1 | tee pytest-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output-${{ matrix.python-version }}-${{ matrix.shard }}
          path: |
            pytest-output.txt
            pytest-report.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Stop Postgres
        # Self-hosted runner instances can serve more than one job before the
        # idle reaper terminates them, so remove the manually-started container
        # (a `services:` container would be auto-reaped). `|| true` keeps a
        # missing/already-gone container from failing the job.
        if: always()
        run: docker rm -f "$PG_CONTAINER" || true

  container:
    name: container
    needs: [reuse_coverage]
    if: always() && needs.reuse_coverage.outputs.skip_suite != 'true'
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The container build resolves the package version before invoking
          # Docker, because .dockerignore keeps .git out of the image context.
          fetch-depth: 0

      - name: Resolve package version
        run: |
          python -m pip install "setuptools-scm[toml]"
          version="$(python -m setuptools_scm --root "$GITHUB_WORKSPACE")"
          echo "YOKE_ENGINE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Yoke core image
        # Retry with backoff: the build starts by pulling base images from
        # Docker Hub, and a transient registry network failure should cost a
        # retry, not the gate. Deterministic build failures still fail after
        # the last attempt.
        run: |
          for delay in 15 60 0; do
            docker build \
              --build-arg "YOKE_ENGINE_VERSION=$YOKE_ENGINE_VERSION" \
              --tag yoke-core:${{ github.sha }} . && exit 0
            if [ "$delay" = 0 ]; then break; fi
            echo "docker build failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          exit 1
