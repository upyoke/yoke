name: yoke-ci

run-name: >-
  ${{ inputs.yoke_dispatch_id
      && format('yoke-ci {0} [yoke-dispatch:{1}]', github.ref_name, inputs.yoke_dispatch_id)
      || format('yoke-ci {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - ".yoke/strategy/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REUSE_WINDOW_HOURS: "24"
  POSTGRES_IMAGE: ghcr.io/upyoke/postgres:16

jobs:
  repo_contracts:
    # Publishes portable wheels and fixture-aware file groups; checks run in parallel.
    timeout-minutes: 10
    name: repo-contracts
    permissions: {contents: read}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    outputs:
      shards: ${{ steps.fan_out.outputs.shards }}
      python_versions: ${{ steps.fan_out.outputs.python_versions }}
      python_latest: ${{ steps.fan_out.outputs.python_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Publish shard fan-out
        id: fan_out
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards fan-out --write-github-output

      - name: Prepare collection runner
        uses: ./.github/actions/yoke-test-runner
        with:
          python-version: ${{ steps.fan_out.outputs.python_latest }}
          pg-container: yoke-ci-collection-pg-${{ github.run_id }}

      - name: Build product wheels and collect shard files
        run: |
          uv run python -m yoke_core.tools.ci_shard_groups &
          grouping_pid=$!
          uv run python -m yoke_core.tools.ci_product_wheels --output "$RUNNER_TEMP/product-wheels" &
          wheels_pid=$!
          result=0
          wait "$grouping_pid" || result=1
          wait "$wheels_pid" || result=1
          exit "$result"

      - name: Share exact-commit product wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-wheels
          path: ${{ runner.temp }}/product-wheels
          retention-days: 7
          if-no-files-found: error

      - name: Share file groups with every shard
        if: always() # Retain collection diagnostics even when grouping refuses.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shard-groups
          path: .yoke/tmp/ci-shard-groups.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Stop collection Postgres
        if: always()
        run: |
          docker rm -f "yoke-ci-collection-pg-${{ github.run_id }}" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
  reuse_coverage:
    timeout-minutes: 5
    name: reuse-coverage
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      skip_suite: ${{ steps.probe.outputs.skip_suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Probe same-tree coverage
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.yoke_ci_tree_reuse --write-github-output
      - name: Record the tree and coverage this run executes
        id: evidence
        if: steps.probe.outputs.skip_suite != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.yoke_ci_coverage_evidence --write-github-output
      - name: Publish coverage evidence
        if: steps.probe.outputs.skip_suite != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: yoke-ci-coverage.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Publish supported Python endpoints
        id: fan_out
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards fan-out --write-github-output
      - name: Set up contract interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '${{ steps.fan_out.outputs.python_latest }}'}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install contract dependencies
        run: uv sync --all-packages --locked
      - name: Refresh shard timing profile from retained CI reports
        continue-on-error: true # Missing compatible telemetry leaves the committed profile usable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m yoke_core.tools.ci_durations_refresh --target-root .
          --latest --repository "${{ github.repository }}"
          --python "${{ steps.fan_out.outputs.python_latest }}"

      - name: Share the timing profile with every shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-durations
          path: .test_durations
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Run repo contracts
        run: >-
          uv run python -m yoke_core.tools.ci_repo_contracts
          --base "origin/${{ github.event.repository.default_branch }}"
  test_shard:
    timeout-minutes: 35
    name: test-shard
    needs: [repo_contracts, reuse_coverage]
    if: ${{ !cancelled() && needs.repo_contracts.result == 'success' && needs.reuse_coverage.result == 'success' }}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    env:
      YOKE_CI_PYTHON_SCOPE: ${{ matrix.python-version == needs.repo_contracts.outputs.python_latest && 'all' || 'interpreter' }}
      SUITE_ALREADY_PROVEN: ${{ needs.reuse_coverage.outputs.skip_suite }}
      PG_CONTAINER: yoke-ci-pg-${{ github.run_id }}-${{ matrix.python-version }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.repo_contracts.outputs.python_versions) }}
        shard: ${{ fromJSON(needs.repo_contracts.outputs.shards) }}

    steps:
      - name: Checkout
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Download assigned file groups
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-shard-groups, path: .yoke/tmp}

      - name: Use the shared timing profile
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-test-durations}

      - name: Download exact-commit product wheels
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-wheels
          path: ${{ runner.temp }}/product-wheels

      - name: Prepare the test runner
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: ./.github/actions/yoke-test-runner
        with:
          python-version: ${{ matrix.python-version }}
          pg-container: ${{ env.PG_CONTAINER }}

      - name: Check runner capacity
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards check-runner-capacity

      - name: Run pytest
        id: pytest
        env:
          PYTHONUNBUFFERED: "1"
          YOKE_CI_PRODUCT_WHEELS: ${{ runner.temp }}/product-wheels
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards run --group "${{ matrix.shard }}"

      - name: Upload pytest output
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        continue-on-error: true # shard-coverage names missing reports and blocks the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output-${{ matrix.python-version }}-${{ matrix.shard }}
          path: |
            .yoke/tmp/ci-shard-files.txt
            pytest-output.txt
            pytest-report.xml
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Stop Postgres
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          docker rm -f "$PG_CONTAINER" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
  shard_coverage:
    timeout-minutes: 15
    name: shard-coverage
    needs: [repo_contracts, reuse_coverage, test_shard]
    if: ${{ !cancelled() && needs.repo_contracts.result == 'success' && needs.reuse_coverage.result == 'success' }}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.repo_contracts.outputs.python_versions) }}
    env:
      SUITE_ALREADY_PROVEN: ${{ needs.reuse_coverage.outputs.skip_suite }}
      YOKE_CI_PYTHON_SCOPE: ${{ matrix.python-version == needs.repo_contracts.outputs.python_latest && 'all' || 'interpreter' }}
      PG_CONTAINER: yoke-ci-coverage-pg-${{ github.run_id }}-${{ matrix.python-version }}
    steps:
      - name: Checkout
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Download every shard report
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pytest-output-${{ matrix.python-version }}-*
          path: shard-reports
      - name: Prepare collection runner
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: ./.github/actions/yoke-test-runner
        with:
          python-version: ${{ matrix.python-version }}
          pg-container: ${{ env.PG_CONTAINER }}
      - name: Compare execution with the unsplit collection
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: >-
          uv run python -m yoke_core.tools.ci_shard_coverage
          --reports shard-reports --python "${{ matrix.python-version }}"
      - name: Upload collection evidence
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-collection-${{ matrix.python-version }}
          path: |
            expected-tests.json
            collection-output.txt
          retention-days: 7
      - name: Stop Postgres
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          docker rm -f "$PG_CONTAINER" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
  browser_runtime:
    needs: [repo_contracts, reuse_coverage]
    if: ${{ !cancelled() && needs.repo_contracts.result == 'success' && needs.reuse_coverage.result == 'success' }}
    uses: ./.github/workflows/browser-runtime-tests.yml
  container:
    timeout-minutes: 10
    name: container
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve package version
        run: |
          python -m pip install "setuptools-scm[toml]"
          version="$(python -m setuptools_scm --root "$GITHUB_WORKSPACE")"
          echo "YOKE_ENGINE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Pull the base image with bounded transport retries
        run: |
          python_image="$(sed -n 's/^ARG PYTHON_IMAGE=//p' Dockerfile)"
          for attempt in 1 2 3 4 5; do
            # artifact-fetch-allow: retry transient GHCR transport failures; five jittered attempts precede the build
            docker pull "$python_image" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((5 + RANDOM % 26))
          done
      - name: Build Yoke core image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          tags: yoke-core:${{ github.sha }}
          build-args: YOKE_ENGINE_VERSION=${{ env.YOKE_ENGINE_VERSION }}
          cache-from: type=gha,scope=yoke-ci-container
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=yoke-ci-container' || '' }}
