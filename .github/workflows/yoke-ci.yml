name: yoke-ci

run-name: >-
  ${{ inputs.yoke_dispatch_id
      && format('yoke-ci {0} [yoke-dispatch:{1}]', github.ref_name, inputs.yoke_dispatch_id)
      || format('yoke-ci {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - ".yoke/strategy/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REUSE_WINDOW_HOURS: "24"
  POSTGRES_IMAGE: ghcr.io/upyoke/postgres:16

jobs:
  repo_contracts:
    timeout-minutes: 5
    name: repo-contracts
    permissions: {contents: read, actions: read}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      shards: ${{ steps.fan_out.outputs.shards }}
      python_versions: ${{ steps.fan_out.outputs.python_versions }}
      python_latest: ${{ steps.fan_out.outputs.python_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Publish shard fan-out
        id: fan_out
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards fan-out --write-github-output

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.fan_out.outputs.python_latest }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Refresh shard timing profile from retained CI reports
        continue-on-error: true # Missing telemetry leaves the committed profile usable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m yoke_core.tools.ci_durations_refresh --target-root .
          --latest --repository "${{ github.repository }}"
          --python "${{ steps.fan_out.outputs.python_latest }}"

      - name: Share the timing profile with every shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-durations
          path: .test_durations
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Run repo contracts
        run: >-
          uv run python -m yoke_core.tools.ci_repo_contracts
          --base "origin/${{ github.event.repository.default_branch }}"
  reuse_coverage:
    timeout-minutes: 5
    name: reuse-coverage
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: read
    outputs:
      skip_suite: ${{ steps.probe.outputs.skip_suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Probe same-tree coverage
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.yoke_ci_tree_reuse --write-github-output
      - name: Record the tree and coverage this run executes
        id: evidence
        if: steps.probe.outputs.skip_suite != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.yoke_ci_coverage_evidence --write-github-output
      - name: Publish coverage evidence
        if: steps.probe.outputs.skip_suite != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: yoke-ci-coverage.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  test_shard:
    timeout-minutes: 35
    name: test-shard
    needs: [repo_contracts, reuse_coverage]
    if: ${{ !cancelled() && needs.repo_contracts.result == 'success' }}
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    env:
      YOKE_CI_PYTHON_SCOPE: ${{ matrix.python-version == needs.repo_contracts.outputs.python_latest && 'all' || 'interpreter' }}
      SUITE_ALREADY_PROVEN: ${{ needs.reuse_coverage.outputs.skip_suite }}
      PG_CONTAINER: yoke-ci-pg-${{ github.run_id }}-${{ matrix.python-version }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.repo_contracts.outputs.python_versions) }}
        shard: ${{ fromJSON(needs.repo_contracts.outputs.shards) }}

    steps:
      - name: Checkout
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Use the shared timing profile
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-test-durations}

      - name: Reclaim runner disk
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.github_runner_disk_reclaim
          --runner-environment "${{ runner.environment }}"
          --runner-os "${{ runner.os }}"

      - name: Set up Python ${{ matrix.python-version }}
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: uv sync --all-packages --all-groups --locked

      - name: Set up Node.js
        if: env.SUITE_ALREADY_PROVEN != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22", cache: npm, cache-dependency-path: packages/yoke-core/src/yoke_core/ui/package-lock.json}
      - name: Install TypeScript compiler
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: npm ci --prefix packages/yoke-core/src/yoke_core/ui

      - name: Register libpython with the system loader cache
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          lib_dir="${pythonLocation}/lib"
          if ! compgen -G "${lib_dir}/libpython*.so*" >/dev/null; then
            echo "No libpython shared library found under ${pythonLocation}/lib" >&2
            exit 1
          fi

          conf_path="/etc/ld.so.conf.d/yoke-setup-python-${{ matrix.python-version }}.conf"
          sudo flock /var/lock/yoke-ci-ldconfig.lock bash -euo pipefail -c '
            printf "%s\n" "$1" > "$2"
            ldconfig
          ' _ "$lib_dir" "$conf_path"

          env -i .venv/bin/python3 -c "import sys; print('clean-env venv python OK', sys.version.split()[0])"

      - name: Configure git identity (CI runners have no ~/.gitconfig)
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          git config --global user.email "ci@yoke.local"
          git config --global user.name "Yoke CI"
          git config --global init.defaultBranch main

      - name: Start Postgres (durability off, dynamic host port)
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          socket_dir="$(mktemp -d /tmp/yoke-ci-pg.XXXXXX)"
          echo "YOKE_PG_SOCKET_DIR=${socket_dir}" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            # artifact-fetch-allow: retry transient GHCR transport failures; five jittered attempts precede use
            docker pull "$POSTGRES_IMAGE" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((5 + RANDOM % 26))
          done
          docker run -d \
            --name "$PG_CONTAINER" \
            -v "${socket_dir}:/var/run/postgresql" \
            -e POSTGRES_USER=yoke \
            -e POSTGRES_PASSWORD=yoke \
            -e POSTGRES_DB=postgres \
            -p 5432 \
            "$POSTGRES_IMAGE" \
            -c fsync=off \
            -c synchronous_commit=off \
            -c full_page_writes=off \
            -c wal_level=minimal \
            -c max_wal_senders=0

      - name: Resolve Postgres DSN (dynamic host port)
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          set -o pipefail
          host_port="$(docker port "$PG_CONTAINER" 5432 | head -n1 | sed 's/.*://')"
          if [ -z "$host_port" ]; then
            echo "Postgres host port did not resolve" >&2
            exit 1
          fi
          echo "Resolved Postgres host port: ${host_port}"
          echo "YOKE_PG_DSN=host=localhost port=${host_port} user=yoke password=yoke dbname=postgres" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: uv run python -m yoke_core.tools.wait_for_pg

      - name: Verify Postgres CREATEDB
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          uv run python - <<'PY'
          from runtime.api.fixtures.pg_testdb import (
              create_test_database,
              drop_test_database,
          )

          name = create_test_database()
          try:
              print("Postgres CREATEDB preflight OK:", name)
          finally:
              drop_test_database(name)
              print("Postgres CREATEDB preflight dropped:", name)
          PY

      - name: Run pytest
        id: pytest
        if: env.SUITE_ALREADY_PROVEN != 'true'
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards run --group "${{ matrix.shard }}"

      - name: Upload pytest output
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        continue-on-error: true # reporting only: an artifact 403 must not conclude a green shard red
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output-${{ matrix.python-version }}-${{ matrix.shard }}
          path: |
            pytest-output.txt
            pytest-report.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Stop Postgres
        if: always() && env.SUITE_ALREADY_PROVEN != 'true'
        run: |
          docker rm -f "$PG_CONTAINER" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
  browser_runtime:
    needs: [repo_contracts, reuse_coverage]
    if: ${{ !cancelled() && needs.repo_contracts.result == 'success' }}
    uses: ./.github/workflows/browser-runtime-tests.yml
  container:
    timeout-minutes: 10
    name: container
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve package version
        run: |
          python -m pip install "setuptools-scm[toml]"
          version="$(python -m setuptools_scm --root "$GITHUB_WORKSPACE")"
          echo "YOKE_ENGINE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Yoke core image
        run: |
          python_image="$(sed -n 's/^ARG PYTHON_IMAGE=//p' Dockerfile)"
          for attempt in 1 2 3 4 5; do
            # artifact-fetch-allow: retry transient GHCR transport failures; five jittered attempts precede the build
            docker pull "$python_image" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((5 + RANDOM % 26))
          done
          docker build \
            --build-arg "YOKE_ENGINE_VERSION=$YOKE_ENGINE_VERSION" \
            --tag yoke-core:${{ github.sha }} .
