name: platform-release-bridge
run-name: "${{ inputs.release_mode }} ${{ inputs.target_environment }} yoke@${{ inputs.product_sha }} [yoke-dispatch:${{ inputs.yoke_dispatch_id }}]"

# One environment coordinate crosses this bridge: `target_environment`, the
# registered Yoke environment name the deployment run's typed environment
# reference resolves to. Every surface on both sides — the fleet-preflight
# receipt gate, the desired-pin writer, and Platform's promotion train — is
# keyed by that registered name, so the bridge passes it through unchanged.
# The dispatch step only refuses an environment with no promotion route.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Registered Yoke environment name to release"
        required: true
        type: choice
        options:
          - stage
          - prod
      release_mode:
        description: "Normal release or prod hotfix"
        required: true
        type: choice
        options:
          - normal
          - hotfix
      product_sha:
        description: "Merged Yoke commit to publish as the next annotated release"
        required: true
        type: string
      deployment_run_id:
        description: "Yoke deployment run that owns this promotion"
        required: true
        type: string
      yoke_dispatch_id:
        description: "Opaque Yoke dispatch correlation token"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-platform-release:
    name: dispatch and await Platform release
    runs-on: ubuntu-24.04
    env:
      YOKE_API_BASE: "https://app.upyoke.com/api/orgs/upyoke"
      YOKE_RELEASE_API_TOKEN: ${{ secrets.YOKE_RELEASE_API_TOKEN }}
      YOKE_PLATFORM_RELEASE_API_TOKEN: ${{ secrets.YOKE_PLATFORM_RELEASE_API_TOKEN }}
    steps:
      - name: Checkout the merged Yoke source and release tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.product_sha }}

      - name: Install this commit's Yoke client
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install the checked-out Yoke packages
        run: |
          python3 -m pip install \
            -e packages/yoke-contracts \
            -e packages/yoke-cli \
            -e packages/yoke-harness \
            -e packages/yoke-core \
            -e .

      - name: Configure scoped Yoke release authority
        run: |
          export YOKE_MACHINE_HOME="$RUNNER_TEMP/yoke-platform-release-bridge"
          echo "YOKE_MACHINE_HOME=$YOKE_MACHINE_HOME" >> "$GITHUB_ENV"
          echo "YOKE_ENV=prod" >> "$GITHUB_ENV"
          printf '%s' "$YOKE_RELEASE_API_TOKEN" | yoke connection set prod \
            --transport https \
            --prod \
            --api-url "$YOKE_API_BASE" \
            --token-stdin >/dev/null

      # Before the tag, because the tag is the first irreversible act: a
      # release refused after it leaves a tag naming a build that never
      # deployed. This submits candidate digests to the control plane's narrow
      # identity verifier and reads receipts plus checked-out history, so it
      # runs on a hosted runner that could never host the rehearsal itself.
      # Bootstrapping it is one passing fleet preflight with --record-receipt,
      # which is also the proof that the fleet is currently clean.
      - name: Verify release migration history before tag
        env:
          PRODUCT_SHA: ${{ inputs.product_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          python3 -m runtime.api.tools.require_fleet_migration_preflight \
            "$TARGET_ENVIRONMENT" "$PRODUCT_SHA"

      - name: Create or recover the immutable annotated release tag
        id: release
        env:
          PRODUCT_SHA: ${{ inputs.product_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          release_tag="$(yoke github release create-next-tag \
            upyoke/yoke "$PRODUCT_SHA" \
            --summary "Automated hosted release for deployment run $DEPLOYMENT_RUN_ID." \
            --project yoke)"
          test -n "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag"

      - name: Await the wheel and server-image release factories
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
        run: |
          for workflow in yoke-release.yml yoke-server-image.yml; do
            run_id=""
            for attempt in $(seq 1 60); do
              if run_id="$(yoke github-actions find-run \
                upyoke/yoke "$workflow" "$PRODUCT_SHA" \
                --project yoke 2>/dev/null)"; then
                break
              fi
              sleep 5
            done
            if [ -z "$run_id" ] || [ "$run_id" = "not_found" ]; then
              echo "release workflow did not appear: $workflow" >&2
              exit 1
            fi
            echo "$workflow run: https://github.com/upyoke/yoke/actions/runs/$run_id"
            if ! factory_state="$(gh run view "$run_id" \
              --repo upyoke/yoke \
              --json status,conclusion,attempt \
              --jq '[.status, .conclusion, .attempt] | @tsv')"; then
              echo "factory_run_state_lookup_failed: check GitHub Actions availability and token permissions, then retry the deployment run" >&2
              exit 1
            fi
            IFS=$'\t' read -r factory_status factory_conclusion factory_attempt \
              <<< "$factory_state"
            if [ "$factory_status" = "completed" ] && [ "$factory_conclusion" = "failure" ]; then
              if [ "$factory_attempt" -gt 1 ]; then
                echo "factory_failed_job_rerun_exhausted: $workflow run $run_id failed after its one failed-job rerun; inspect the run and retry the deployment after correcting it" >&2
              else
                rerun_output="$RUNNER_TEMP/${workflow%.yml}-${run_id}-rerun.txt"
                if gh run rerun "$run_id" \
                  --repo upyoke/yoke \
                  --failed >"$rerun_output" 2>&1; then
                  cat "$rerun_output"
                  echo "$workflow run $run_id had already failed; requested its one failed-job rerun"
                else
                  rerun_rc=$?
                  sleep 2
                  if ! refreshed_state="$(gh run view "$run_id" \
                    --repo upyoke/yoke \
                    --json status,conclusion,attempt \
                    --jq '[.status, .conclusion, .attempt] | @tsv')"; then
                    cat "$rerun_output" >&2
                    echo "factory_failed_job_rerun_refused: GitHub refused the rerun and its state could not be refreshed; inspect run $run_id, then retry the deployment" >&2
                    exit "$rerun_rc"
                  fi
                  IFS=$'\t' read -r refreshed_status refreshed_conclusion refreshed_attempt \
                    <<< "$refreshed_state"
                  if [ "$refreshed_status" = "completed" ] \
                    && [ "$refreshed_conclusion" = "failure" ] \
                    && [ "$refreshed_attempt" -le "$factory_attempt" ]; then
                    cat "$rerun_output" >&2
                    echo "factory_failed_job_rerun_refused: GitHub refused the one rerun for $workflow run $run_id; inspect the response above, then retry the deployment" >&2
                    exit "$rerun_rc"
                  fi
                  echo "Another bridge already restarted $workflow run $run_id; joining that rerun"
                fi
                sleep 2
              fi
            fi
            yoke github-actions wait-run \
              upyoke/yoke "$run_id" \
              --project yoke \
              --timeout 3600
          done

      - name: Switch to scoped Platform promotion authority
        run: |
          printf '%s' "$YOKE_PLATFORM_RELEASE_API_TOKEN" | yoke connection set prod \
            --transport https \
            --prod \
            --api-url "$YOKE_API_BASE" \
            --token-stdin >/dev/null

      - name: Dispatch and await Platform pin promotion and release
        env:
          PRODUCT_REF: ${{ steps.release.outputs.tag }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          OUTER_DISPATCH_ID: ${{ inputs.yoke_dispatch_id }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            stage|prod) ;;
            *)
              echo "no Platform promotion route for environment $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          request_id="bridge:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${OUTER_DISPATCH_ID}"
          dispatch_error="$RUNNER_TEMP/platform-release-dispatch-error.txt"
          platform_run_id=""
          for attempt in $(seq 1 12); do
            if platform_run_id="$(yoke github-actions trigger \
              upyoke/platform yoke-release-promote.yml \
              --ref main \
              --input "target_environment=$TARGET_ENVIRONMENT" \
              --input "product_ref=$PRODUCT_REF" \
              --input "release_mode=$RELEASE_MODE" \
              --request-id "$request_id" \
              --correlation-input yoke_dispatch_id \
              --project platform 2>"$dispatch_error")"; then
              break
            else
              dispatch_rc=$?
            fi
            cat "$dispatch_error" >&2
            if ! grep -q "workflow_dispatch_ambiguous" "$dispatch_error"; then
              exit "$dispatch_rc"
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Platform release dispatch remained ambiguous after bounded recovery" >&2
              exit "$dispatch_rc"
            fi
            # The server has already recorded durable intent. Reusing the same
            # request id and payload lets the same scoped actor discover the
            # correlated GitHub run without posting another dispatch.
            sleep 5
          done
          test -n "$platform_run_id"
          echo "Platform release run: https://github.com/upyoke/platform/actions/runs/$platform_run_id"
          yoke github-actions wait-run \
            upyoke/platform "$platform_run_id" \
            --project platform \
            --timeout 10800

      - name: Record desired pin after successful Platform release
        env:
          PRODUCT_REF: ${{ steps.release.outputs.tag }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          VERSION="${PRODUCT_REF#v}"
          test -n "$VERSION"
          receipt="$(yoke release-pin record \
            --project platform \
            --environment "$TARGET_ENVIRONMENT" \
            --pin "$VERSION")"
          test -n "$receipt"
          echo "Desired release pin receipt: $receipt"
