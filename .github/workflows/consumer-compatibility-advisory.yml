name: consumer-compatibility-advisory
run-name: "consumer-compatibility-advisory ${{ github.event.pull_request.head.sha || github.sha }}${{ inputs.yoke_dispatch_id && format(' [yoke-dispatch:{0}]', inputs.yoke_dispatch_id) || '' }}"

# Advisory evidence has its own workflow-run conclusion. A job timeout can
# cancel a run even with continue-on-error, so it must never share the required
# yoke-ci run adopted by QA. Logs, warnings, and the job summary remain evidence;
# the exact-pair release proof still gates publication. FACTORY: read-only token,
# one scoped consumer credential on one step. Forks skip this upstream check.
#
# A PR gets the content-keyed advisory. A main push or manual run starts the
# release gate's exact-pair proof for that commit and Platform main's current
# commit, overlapping main verification and release preparation; a release
# binding the same pair joins that consumer run instead of dispatching again.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # `yoke github-actions trigger upyoke/yoke consumer-compatibility-advisory.yml
  # --ref BRANCH --request-id ID --correlation-input yoke_dispatch_id
  # --project yoke` proves BRANCH's head commit as an exact pair.
  workflow_dispatch:
    inputs:
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""
        type: string

# A newer push supersedes a PR advisory, but never a main commit's exact-pair
# proof: an older frozen release of that commit may be waiting to join it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  advisory:
    if: github.repository == 'upyoke/yoke'
    timeout-minutes: 20
    name: consumer-compatibility-advisory
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Check whether the hosted consumer builds against this candidate
        env:
          YOKE_PLATFORM_RELEASE_API_TOKEN: ${{ secrets.YOKE_PLATFORM_RELEASE_API_TOKEN }}
          YOKE_MACHINE_HOME: ${{ runner.temp }}/yoke-consumer-advisory
        run: >-
          uv run python -m runtime.api.tools.consumer_compatibility_advisory
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --timeout 900
          ${{ github.event_name != 'pull_request' && '--exact-pair' || '' }}
