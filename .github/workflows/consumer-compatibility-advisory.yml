name: Consumer compatibility advisory

# Advisory: a producer-only green run proves the producer and nothing else,
# so an author changing the surface the hosted host consumes hears it here
# rather than at the release. It never decides yoke-ci's own required
# checks — this job carries no required status-check context and no other
# job needs it, so repo-contracts and the shard matrix start without
# waiting on it. The release bridge's own required exact consumer proof
# remains authoritative. FACTORY workflow: read-only GITHUB_TOKEN; the
# scoped consumer credential is bound to the one step below via `secrets:
# inherit` and is absent on a fork, where the step says the pair was not
# checked instead of implying a clean answer.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  advisory:
    name: consumer-compatibility-advisory
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Advise whether the hosted consumer builds against this candidate
        continue-on-error: true
        env:
          YOKE_PLATFORM_RELEASE_API_TOKEN: ${{ secrets.YOKE_PLATFORM_RELEASE_API_TOKEN }}
          YOKE_MACHINE_HOME: ${{ runner.temp }}/yoke-consumer-advisory
        run: >-
          uv run python -m runtime.api.tools.consumer_compatibility_advisory
          --base "origin/${{ github.event.repository.default_branch }}"
          --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --dispatch-key "${{ github.run_id }}-${{ github.run_attempt }}"
