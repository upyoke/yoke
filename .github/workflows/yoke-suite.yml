name: yoke-suite

# Layer 1 (test suite) of the multi-OS CI model: the full pytest suite on
# Windows and macOS, one Python (the newest supported), on demand. Linux CI
# (yoke-ci) owns the required verdict; this workflow measures how much of the
# same suite passes elsewhere and how long it takes.
#
# A Linux plan job collects the suite once and publishes yoke-ci's file
# groups and exact-commit product wheels. Each OS then runs the same
# ci_shards groups with the product's own native Postgres engine
# (yoke_core.tools.ci_suite_postgres) instead of a container.
#
# Dispatch-only: macOS runners stay out of automatic CI
# (runtime/api/cli/test_github_workflow_runner_routing.py). See
# docs/testing-verification/multi-os-suite.md.
run-name: >-
  ${{ inputs.yoke_dispatch_id
      && format('yoke-suite {0} [yoke-dispatch:{1}]', inputs.sha || github.sha, inputs.yoke_dispatch_id)
      || format('yoke-suite {0}', inputs.sha || github.sha) }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full or abbreviated commit SHA to test; empty tests the dispatched ref.
        required: false
        default: ""
      yoke_dispatch_id:
        description: Correlation id echoed into run-name; empty for hand triggers.
        required: false
        default: ""

concurrency:
  group: yoke-suite-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  POSTGRES_IMAGE: ghcr.io/upyoke/postgres:16

jobs:
  plan:
    timeout-minutes: 15
    name: plan
    runs-on: ${{ fromJSON(vars.YOKE_LINUX_RUNS_ON || '["ubuntu-26.04"]') }}
    outputs:
      commit: ${{ steps.resolve_commit.outputs.commit }}
      shards: ${{ steps.fan_out.outputs.shards }}
      python_latest: ${{ steps.fan_out.outputs.python_latest }}
    steps:
      - name: Fetch repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve and check out suite commit
        id: resolve_commit
        shell: bash
        env:
          SUITE_REVISION: ${{ inputs.sha || github.sha }}
        run: |
          if [[ "$SUITE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]] &&
              ! git rev-parse --verify --quiet --end-of-options "${SUITE_REVISION}^{commit}" >/dev/null; then
            git fetch --no-tags origin "$SUITE_REVISION" || true
          fi
          if ! [[ "$SUITE_REVISION" =~ ^[0-9a-fA-F]{4,40}$ ]] ||
              ! commit=$(git rev-parse --verify --quiet --end-of-options "${SUITE_REVISION}^{commit}") ||
              [[ "$commit" != "${SUITE_REVISION,,}"* ]]; then
            printf 'Cannot resolve suite SHA %q. Dispatch again with a full commit SHA published to this repository.\n' "$SUITE_REVISION" >&2
            exit 1
          fi
          git checkout --detach "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'Suite commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
          printf '{"tested_sha":"%s"}\n' "$commit" > "$RUNNER_TEMP/suite-commit.json"
      - name: Share tested commit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-commit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/suite-commit.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish shard fan-out
        id: fan_out
        run: >-
          PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
          yoke_core.tools.ci_shards fan-out --write-github-output
      - name: Prepare collection runner
        uses: ./.github/actions/yoke-test-runner
        with:
          python-version: ${{ steps.fan_out.outputs.python_latest }}
          pg-container: yoke-suite-collection-pg-${{ github.run_id }}
      - name: Build product wheels and collect shard files
        run: |
          uv run python -m yoke_core.tools.ci_shard_groups &
          grouping_pid=$!
          uv run python -m yoke_core.tools.ci_product_wheels --output "$RUNNER_TEMP/product-wheels" &
          wheels_pid=$!
          result=0
          wait "$grouping_pid" || result=1
          wait "$wheels_pid" || result=1
          exit "$result"
      - name: Share exact-commit product wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-wheels
          path: ${{ runner.temp }}/product-wheels
          retention-days: 7
          if-no-files-found: error
      - name: Share file groups with every shard
        if: always() && steps.resolve_commit.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shard-groups
          path: .yoke/tmp/ci-shard-groups.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Stop collection Postgres
        if: always()
        run: |
          docker rm -f "yoke-suite-collection-pg-${{ github.run_id }}" || true
          if [ -n "${YOKE_PG_SOCKET_DIR:-}" ]; then sudo rm -rf -- "$YOKE_PG_SOCKET_DIR"; fi
  suite:
    timeout-minutes: 30
    name: suite (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      YOKE_CI_PYTHON_SCOPE: all
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        include:
          - os: windows
            runner: windows-2025
          - os: macos
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Download assigned file groups
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-shard-groups, path: .yoke/tmp}
      - name: Download exact-commit product wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-wheels
          path: ${{ runner.temp }}/product-wheels
      - name: Set up Python ${{ needs.plan.outputs.python_latest }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '${{ needs.plan.outputs.python_latest }}'}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --all-packages --locked --python "${{ needs.plan.outputs.python_latest }}"
      - name: Set up Node.js
        # Selected TypeScript contract tests fail without the toolchain.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22", cache: npm, cache-dependency-path: packages/yoke-core/src/yoke_core/ui/package-lock.json}
      - name: Install TypeScript compiler
        run: npm ci --prefix packages/yoke-core/src/yoke_core/ui
      - name: Configure git identity
        run: |
          git config --global user.email "ci@yoke.local"
          git config --global user.name "Yoke CI"
          git config --global init.defaultBranch main
      - name: Provision Windows shell and symlinks
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $gitRoot = Join-Path $env:ProgramFiles 'Git'
          $gitBash = Join-Path $gitRoot 'bin/bash.exe'
          if (-not (Test-Path $gitBash)) {
            choco install git --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $gitRoot 'cmd')
          }
          & $gitBash --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "YOKE_CI_GIT_BASH=$gitBash"
          $ripgrep = (Get-Command rg.exe -CommandType Application -ErrorAction SilentlyContinue).Source
          if (-not $ripgrep) {
            choco install ripgrep --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ripgrep = Join-Path $env:ChocolateyInstall 'bin/rg.exe'
          }
          if (-not (Test-Path -LiteralPath $ripgrep -PathType Leaf)) {
            throw "Windows runner could not locate ripgrep after provisioning: $ripgrep"
          }
          & $ripgrep --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $ripgrep)
          $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $unlock -Force | Out-Null
          New-ItemProperty -Path $unlock -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
          python -c "from pathlib import Path; from tempfile import TemporaryDirectory; d = TemporaryDirectory(); p = Path(d.name); (p / 'link').symlink_to(p, target_is_directory=True); assert (p / 'link').is_symlink()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision macOS shell and search tools
        if: matrix.os == 'macos'
        run: |
          command -v rg || brew install ripgrep
          command -v fish || brew install fish
          fish --version
      - name: Verify ripgrep is provisioned
        run: rg --version
      - name: Start the native test Postgres
        run: uv run --frozen python -m yoke_core.tools.ci_suite_postgres start
      - name: Stress Windows timing regressions
        if: matrix.os == 'windows' && matrix.shard == 1
        timeout-minutes: 5
        run: |
          set -o pipefail
          picker=runtime/api/cli/test_yoke_operations_cli_onboard_wizard_clone_outcome.py
          javascript=runtime/api/test_universe_ui_mount_contract.py
          for attempt in 1 2 3 4 5; do
            printf 'Windows timing check %s/5\n' "$attempt"
            uv run --frozen python -m pytest -n 0 -q \
              "$picker::test_empty_private_repo_picker_requires_app_access" \
              "$javascript::test_universe_ui_javascript_modules_in_node"
          done
          uv run --frozen python -m pytest -n 0 -q --capture=tee-sys \
            runtime/api/tools/test_ci_shards.py::test_shard_log_preserves_hung_worker_traceback_before_exit \
            | tee -a pytest-output.txt
      - name: Run pytest
        # End a hung step before the job deadline so artifact upload can run.
        timeout-minutes: 18
        env:
          YOKE_CI_PRODUCT_WHEELS: ${{ runner.temp }}/product-wheels
        # -v names every test as it finishes. --max-worker-restart=0 ends the
        # shard when a test kills its xdist worker: a replaced worker never
        # receives its shutdown, so each worker would wait on its last queued
        # test until the job timed out.
        run: >-
          uv run --frozen python -m yoke_core.tools.ci_shards run --group "${{ matrix.shard }}"
          -- -v --max-worker-restart=0 -o faulthandler_timeout=300
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-output-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            .yoke/tmp/ci-shard-files.txt
            pytest-output.txt
            pytest-report.xml
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
      - name: Stop the native test Postgres
        if: always()
        run: uv run --frozen python -m yoke_core.tools.ci_suite_postgres stop || true
