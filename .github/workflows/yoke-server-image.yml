name: yoke-server-image
# Classification: FACTORY. Publishes the GHCR Yoke server image referenced by
# the self-host compose .env (yoke_contracts.server_image); stays in the public product repo.
# Main builds and attests native images; release tags promote those exact digests.
# Signing runs without checkout or run steps and never publishes release pointers.
on:
  merge_group:
  push:
    branches: [main]
    tags: ["[0-9]*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  validate-tag:
    timeout-minutes: 5
    name: resolve-commit-identity
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      latest_ref: ${{ steps.tag.outputs.latest_ref }}
      repository: ${{ steps.commit.outputs.repository || steps.tag.outputs.repository }}
      release_version: ${{ steps.commit.outputs.release_version || steps.tag.outputs.release_version }}
      version_ref: ${{ steps.tag.outputs.version_ref }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      source_sha: ${{ steps.commit.outputs.source_sha || steps.tag.outputs.source_sha }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    steps:
      - name: Check out the exact workflow commit for read-only tag validation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact main or queue commit clock
        id: commit
        if: github.ref == 'refs/heads/main' || github.event_name == 'merge_group'
        env:
          PYTHONPATH: packages/yoke-contracts/src
        run: |
          python3 packages/yoke-core/src/yoke_core/tools/commit_release_identity.py \
            --source-sha "$GITHUB_SHA" --github-output
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yoke-server" >> "$GITHUB_OUTPUT"
      - name: Require an immutable annotated release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PYTHONPATH: packages/yoke-contracts/src
        run: python3 packages/yoke-core/src/yoke_core/tools/release_tag_validation.py
  check-build:
    if: github.event_name == 'merge_group'
    timeout-minutes: 10
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read}
    strategy:
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-latest}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Check both native image builds without registry or signing authority
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            YOKE_BUILD_SHA=${{ needs.validate-tag.outputs.source_sha }}
            YOKE_ENGINE_VERSION=${{ needs.validate-tag.outputs.release_version }}
  build:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    name: build-native-${{ matrix.arch }}
    needs: validate-tag
    permissions: {contents: read, packages: write}
    # GHCR publishing carries no operator state: hosted runners can do it all.
    # Hard-pinning avoids operator fleets even where runner-routing is configured.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-tag.outputs.source_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the native content-addressed image
        id: push
        # Push without version/latest. /v1/health exposes the baked full source SHA;
        # package versions use the exact commit UTC clock.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          # Push content-addressed images first without changing human-facing tags;
          # post-attestation publication refuses a conflicting immutable version.
          outputs: type=image,name=${{ needs.validate-tag.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            YOKE_BUILD_SHA=${{ needs.validate-tag.outputs.source_sha }}
            YOKE_ENGINE_VERSION=${{ needs.validate-tag.outputs.release_version }}
      - name: Verify native architecture and installed release metadata
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_BUILD: ${{ needs.validate-tag.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.release_version }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
          REPOSITORY: ${{ needs.validate-tag.outputs.repository }}
        run: |
          python3 packages/yoke-core/src/yoke_core/tools/server_image_metadata.py verify-native \
            --image-ref "$REPOSITORY@$PUSHED_DIGEST" \
            --expected-arch "$EXPECTED_ARCH" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-build "$EXPECTED_BUILD" \
            --digest-dir "$RUNNER_TEMP/digests"
      - name: Upload the native image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    name: assemble-content-addressed-image
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions: {actions: read, packages: write}
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      staging_ref: ${{ steps.manifest.outputs.staging_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download native image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Assemble and verify the multi-platform manifest
        id: manifest
        env:
          REPOSITORY: ${{ needs.validate-tag.outputs.repository }}
        run: |
          mapfile -t digest_files < <(
            find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -print | sort
          )
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "expected two native image digests, found ${#digest_files[@]}" >&2
            exit 1
          fi
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "$digest_file")"
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "malformed native image digest filename: $digest" >&2
              exit 1
            fi
            sources+=("$REPOSITORY@sha256:$digest")
          done
          staging_ref="$REPOSITORY:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata="$RUNNER_TEMP/manifest-metadata.json"
          docker buildx imagetools create \
            --tag "$staging_ref" \
            --metadata-file "$metadata" \
            "${sources[@]}"
          digest="$(jq -er '."containerimage.descriptor".digest' "$metadata")"
          registry_digest="$(docker buildx imagetools inspect \
            "$staging_ref" --format '{{ .Manifest.Digest }}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || "$registry_digest" != "$digest" ]]; then
            echo "assembled manifest digest mismatch: metadata=$digest registry=$registry_digest" >&2
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect \
            "$staging_ref" --format '{{json .Manifest}}')"
          platforms="$(jq -r \
            '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | unique | sort | join(",")' \
            <<< "$manifest")"
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "assembled image lacks the required linux platforms: $platforms" >&2
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "staging_ref=$staging_ref"
          } >> "$GITHUB_OUTPUT"
  attest:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    name: attest-content-addressed-image
    needs: [validate-tag, assemble]
    runs-on: ubuntu-latest
    permissions: {attestations: write, contents: read, id-token: write, packages: write}
    steps:
      # Deliberately no checkout and no run step: repository code never shares
      # the OIDC identity or attestation write scope.
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the untagged image digest
        id: attest_attempt_1
        continue-on-error: true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ needs.validate-tag.outputs.repository }}
          subject-digest: ${{ needs.assemble.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Retry the image attestation after a registry transport failure
        id: attest_attempt_2
        if: steps.attest_attempt_1.outcome != 'success'
        continue-on-error: true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ needs.validate-tag.outputs.repository }}
          subject-digest: ${{ needs.assemble.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Make the final image attestation attempt
        if: >-
          steps.attest_attempt_1.outcome != 'success' &&
          steps.attest_attempt_2.outcome != 'success'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ needs.validate-tag.outputs.repository }}
          subject-digest: ${{ needs.assemble.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
  record:
    timeout-minutes: 5
    needs: [validate-tag, assemble, attest]
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: Record the attested main image identity
        env:
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
          REPOSITORY: ${{ needs.validate-tag.outputs.repository }}
          DIGEST: ${{ needs.assemble.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {key: os.environ[env] for key, env in (
              ("source_sha", "SOURCE_SHA"), ("release_version", "RELEASE_VERSION"),
              ("repository", "REPOSITORY"), ("digest", "DIGEST"))}
          Path("image.json").write_text(json.dumps(record, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yoke-image-${{ github.sha }}
          path: image.json
          retention-days: 14
          if-no-files-found: error

  publish-tags:
    timeout-minutes: 10
    concurrency:
      group: yoke-server-image-publication-${{ github.repository }}
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/')
    name: promote-and-verify-image-tags
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions: {actions: read, attestations: read, contents: read, packages: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover and verify the attested main image
        id: promoted
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.release_version }}
        run: |
          PYTHONPATH=packages/yoke-contracts/src python3 packages/yoke-core/src/yoke_core/tools/promote_main_artifacts.py image \
            --repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP/main-image"
      - name: Revalidate tag and publish exact image references
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate-tag.outputs.tag_object_sha }}
          PUSHED_DIGEST: ${{ steps.promoted.outputs.digest }}
        run: |
          PYTHONPATH=packages/yoke-contracts/src:packages/yoke-core/src python3 packages/yoke-core/src/yoke_core/tools/publish_server_image.py
