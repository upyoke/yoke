name: yoke-windows-local-postgres
on:
  pull_request:
    paths:
      - '**/postgres_cluster*.py'
      - '**/postgres_binaries.py'
      - '**/universe_ui_daemon*.py'
      - '**/universe_ui_launchd.py'
      - '**/universe_archive_output.py'
      - '**/universe_import_cli.py'
      - '**/test_postgres_windows.py'
      - 'runtime/api/tools/verify_windows_local_postgres.py'
      - '.github/workflows/yoke-windows-local-postgres.yml'
permissions:
  contents: read
jobs:
  local-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: runner.os != 'Windows'
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Select the public installer's Windows Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The uv download catalog on this runner does not include this patch.
          $archive = Join-Path $env:RUNNER_TEMP 'yoke-cpython-3.12.16.tar.gz'
          $uri = 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.12.16%2B20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '1f2ab53880fc67ea323398c6388e05af28addc99a8e389209f08a51fdff4b149') {
            throw 'Windows CPython 3.12.16 archive checksum mismatch'
          }
          tar.exe -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the Windows CPython test interpreter' }
          $python = Join-Path $env:RUNNER_TEMP 'python\python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not start the Windows CPython test interpreter' }
          "UV_PYTHON=$python" >> $env:GITHUB_ENV
      - run: uv sync --all-packages --locked
      - name: Local engine lifecycle, owner isolation, and universe round trip
        run: uv run --frozen python -m runtime.api.tools.verify_windows_local_postgres
      - name: Portable engine helpers and detached dashboard lifecycle
        run: >-
          uv run --frozen python -m pytest --noconftest -p runtime.os_scope_markers -q
          runtime/api/domain/test_postgres_windows.py
          runtime/api/domain/test_universe_archive_output_windows.py
          runtime/api/cli/test_yoke_universe_ui_daemon.py
          runtime/api/cli/test_yoke_universe_ui_daemon_windows.py
          runtime/api/cli/test_yoke_universe_ui_restart.py
          runtime/api/cli/test_universe_ui_daemon_process_identity.py
