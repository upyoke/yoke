name: yoke-test-runner
description: >-
  Prepare one runner to run Yoke's pytest suite or a change-scoped selection
  of it: interpreter, locked dependencies, the TypeScript toolchain, git
  identity and a durability-off Postgres. yoke-ci's test-shard and
  yoke-tests-selection's shards both run these exact steps, so a selection
  shard is set up exactly like a full CI shard. It is a composite action, not
  a reusable workflow, so each caller keeps its own job and check names.
  The caller checks out the commit first, declares the public GHCR mirror
  image as workflow env POSTGRES_IMAGE, and stops the container afterwards.

inputs:
  python-version:
    description: Python version the shard runs on.
    required: true
  pg-container:
    description: Run- and shard-scoped Postgres container name; shared self-hosted hosts never collide.
    required: true

runs:
  using: composite
  steps:
    - name: Reclaim runner disk
      shell: bash
      run: >-
        PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src python3 -m
        yoke_core.tools.github_runner_disk_reclaim
        --runner-environment "${{ runner.environment }}"
        --runner-os "${{ runner.os }}"

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Prepare runner prerequisites, dependencies and Postgres
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        PG_CONTAINER: ${{ inputs.pg-container }}
      run: >-
        PYTHONPATH=packages/yoke-core/src:packages/yoke-contracts/src:packages/yoke-cli/src:packages/yoke-harness/src
        python3 -S -m yoke_core.tools.ci_runner_prepare

    - name: Set up Node.js
      # Selected TypeScript contract tests fail without the toolchain.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with: {node-version: "22", cache: npm, cache-dependency-path: packages/yoke-core/src/yoke_core/ui/package-lock.json}

    - name: Install TypeScript compiler
      shell: bash
      run: npm ci --prefix packages/yoke-core/src/yoke_core/ui

    - name: Register libpython with the system loader cache
      # Tests spawn python3 with a cleaned env (merge engine, installer
      # shim, product-boundary probes); those subprocesses find libpython
      # through the system loader cache, not LD_LIBRARY_PATH.
      shell: bash
      run: |
        lib_dir="${pythonLocation}/lib"
        if ! compgen -G "${lib_dir}/libpython*.so*" >/dev/null; then
          echo "No libpython shared library found under ${pythonLocation}/lib" >&2
          exit 1
        fi

        conf_path="/etc/ld.so.conf.d/yoke-setup-python-${{ inputs.python-version }}.conf"
        sudo flock /var/lock/yoke-ci-ldconfig.lock bash -euo pipefail -c '
          printf "%s\n" "$1" > "$2"
          ldconfig
        ' _ "$lib_dir" "$conf_path"

        env -i .venv/bin/python3 -c "import sys; print('clean-env venv python OK', sys.version.split()[0])"

    - name: Configure git identity (CI runners have no ~/.gitconfig)
      shell: bash
      run: |
        git config --global user.email "ci@yoke.local"
        git config --global user.name "Yoke CI"
        git config --global init.defaultBranch main

    - name: Wait for Postgres
      shell: bash
      run: uv run python -m yoke_core.tools.wait_for_pg

    - name: Verify Postgres CREATEDB
      shell: bash
      run: |
        uv run python - <<'PY'
        from runtime.api.fixtures.pg_testdb import (
            create_test_database,
            drop_test_database,
        )

        name = create_test_database()
        try:
            print("Postgres CREATEDB preflight OK:", name)
        finally:
            drop_test_database(name)
            print("Postgres CREATEDB preflight dropped:", name)
        PY
