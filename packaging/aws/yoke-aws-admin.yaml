AWSTemplateFormatVersion: "2010-09-09"

# Bootstrap credential for a Yoke project's `aws-admin` capability.
#
# Custody, stated plainly:
#   * This stack mints a BROAD, operator-attended bootstrap credential. It is
#     the key a human pastes into the Yoke onboarding wizard once, on their own
#     machine, to let Yoke build the rest of the account's infrastructure.
#   * The two values live on that machine only, under
#     ~/.yoke/secrets/capability-secrets/<project-slug>/aws-admin/, owner-only.
#     Yoke never uploads them and never prints them back.
#   * CI never receives this key. Deploy pipelines federate through short-lived
#     GitHub OIDC roles that Yoke provisions FROM this credential later, each
#     scoped to the resources that pipeline actually touches.
#   * Delete the stack to revoke the credential in one action.
#
# The secret access key is a CloudFormation Output on purpose. Anyone with
# CloudFormation read — including read-only console users, a wider group than
# administrators — can see both values, and they persist in stack history.
# That trade is accepted because the stack runs in the operator's own account
# and mints a credential for that same account: anyone who can read these
# Outputs already holds enough access to create an equivalent administrator
# user. Putting the pair on the Outputs tab is the cheaper first-minute path
# (open, acknowledge IAM capabilities, create, copy). Hiding the secret in
# another service would cost two extra actions without changing who can mint
# an equivalent key.

Description: >-
  Creates the yoke-aws-admin IAM user and access key. Both values appear as
  stack Outputs for one-time paste into the Yoke onboarding wizard.

Resources:
  YokeAwsAdminUser:
    Type: AWS::IAM::User
    Properties:
      UserName: yoke-aws-admin
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: ManagedBy
          Value: yoke
        - Key: Purpose
          Value: yoke-onboarding-bootstrap

  YokeAwsAdminAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref YokeAwsAdminUser

Outputs:
  AccessKeyId:
    Description: Access key id for the yoke-aws-admin user.
    Value: !Ref YokeAwsAdminAccessKey
  SecretAccessKey:
    Description: >-
      Secret access key for the yoke-aws-admin user. Visible to anyone who
      can read this stack's Outputs, and retained in stack history.
    Value: !GetAtt YokeAwsAdminAccessKey.SecretAccessKey
  AccountId:
    Description: AWS account id this credential administers.
    Value: !Ref AWS::AccountId
