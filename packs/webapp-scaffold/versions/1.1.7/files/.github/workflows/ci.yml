name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          timeout --kill-after=10 600 pip install --retries 3 --timeout 30 -r requirements.txt pytest pytest-asyncio || {
            echo "pip_install_failed: dependencies could not be fetched and verified within 600s; check DNS and package registry access, then re-run" >&2
            exit 1
          }

      - name: Run tests
        run: python3 -m pytest tests/ -v

  frontend-unit:
    name: Frontend tests (vitest) + build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        run: |
          # npm10 can exit zero after failed downloads; verify direct dependencies too.
          timeout --kill-after=10 600 sh -c 'npm ci --fetch-retries=3 --fetch-timeout=30000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 && npm ls --depth=0' || {
            echo "npm_install_failed: dependencies could not be fetched and verified within 600s; check DNS and package registry access, then re-run" >&2
            exit 1
          }

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  frontend-e2e:
    name: E2E tests (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          timeout --kill-after=10 600 pip install --retries 3 --timeout 30 -r requirements.txt || {
            echo "pip_install_failed: dependencies could not be fetched and verified within 600s; check DNS and package registry access, then re-run" >&2
            exit 1
          }
        working-directory: app

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        run: |
          # npm10 can exit zero after failed downloads; verify direct dependencies too.
          timeout --kill-after=10 600 sh -c 'npm ci --fetch-retries=3 --fetch-timeout=30000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 && npm ls --depth=0' || {
            echo "npm_install_failed: dependencies could not be fetched and verified within 600s; check DNS and package registry access, then re-run" >&2
            exit 1
          }

      - name: Install Playwright browsers
        run: |
          fail() { echo "$*" >&2; exit 1; }
          sudo mkdir -p /etc/apt/apt.conf.d
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "60";' 'APT::Update::Error-Mode "any";' | sudo tee /etc/apt/apt.conf.d/99-bounded-fetch >/dev/null
          _apt_status=0
          timeout --kill-after=10 600 npx --no-install playwright install-deps chromium || _apt_status=$?
          if [ "$_apt_status" -eq 124 ] || [ "$_apt_status" -eq 137 ]; then
            fail "apt_mirror_timeout: Playwright OS dependencies did not finish within 600s; check this host's DNS and outbound network, then re-run"
          elif [ "$_apt_status" -ne 0 ]; then
            fail "apt_failed: Playwright OS dependencies exited $_apt_status; read the apt output above, fix DNS or mirror access, then re-run"
          fi
          timeout --kill-after=10 600 env PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=30000 npx --no-install playwright install chromium || {
            fail "playwright_download_failed: Chromium could not be fetched within 600s; check DNS and browser download access, then re-run"
          }

      - name: Run E2E tests (excluding production smoke tests)
        run: npx playwright test --config=e2e/playwright.config.ts --grep-invert "@smoke|@setup"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            app/web/playwright-report/
            app/web/test-results/
          retention-days: 7
